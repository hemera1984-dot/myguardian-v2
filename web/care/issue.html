<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안창민 케어센터 - 마이가디언</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/platform.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/care.js"></script>
</head>
<body class="magazine">
  <header class="mag-topbar">
    <a class="mag-home" href="./">
      <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg>서재
    </a>
    <span class="mag-top-title" id="top-title">케어센터</span>
    <button type="button" class="font-toggle" id="font-toggle" aria-label="글자 크기 조절">가</button>
  </header>
  <div class="mag-progress" id="mag-progress" style="width:0"></div>

  <main class="issue" id="issue">
    <p class="issue-loading">발행물을 불러오는 중입니다.</p>
  </main>

  <script>
    (function () {
      "use strict";
      var root = document.getElementById("issue");

      // 조판(제호·기사·판권)은 care.js가 맡는다 — 발행 데스크 미리보기와 같은 함수를 쓴다.

      function notFound() {
        document.title = "발행물을 찾을 수 없습니다 - 케어센터";
        root.innerHTML = '<header class="issue-head">'
          + '<p class="issue-masthead">케어센터</p>'
          + '<p class="issue-line">발행물을 찾을 수 없습니다</p>'
          + "</header>"
          + '<div class="issue-missing"><p>주소가 잘못되었거나 아직 발행되지 않은 호입니다.<br>'
          + "전달받은 링크를 다시 확인하시거나 담당 설계사에게 문의해 주십시오.</p>"
          + '<a class="issue-return" href="./">케어센터 서재로 이동</a></div>';
      }

      function render(meta, data, list, edition) {
        document.body.dataset.ch = meta["채널"];
        root.innerHTML = window.care.issueHtml(meta, data, list, edition);
        document.getElementById("top-title").textContent =
          meta["채널"] + " " + (meta["발행인"] || "안창민") + " · 통권 " + meta["호수"] + "호";
        initProgress();
      }

      // 읽기 진행 표시줄 — 세로 스크롤 기준
      function initProgress() {
        var bar = document.getElementById("mag-progress");
        function update() {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var p = max > 0 ? Math.min(1, window.scrollY / max) : 1;
          bar.style.width = (p * 100) + "%";
        }
        window.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
        update();
      }

      // 글자 크기 조절: 보통 → 크게 → 아주 크게 (저장됨)
      (function () {
        var FS_KEY = "mg_care_fs";
        var btn = document.getElementById("font-toggle");
        var levels = ["", "fs-2", "fs-3"];
        var labels = ["가", "가+", "가++"];
        var idx = Math.max(0, levels.indexOf(localStorage.getItem(FS_KEY) || ""));
        function apply() {
          document.body.classList.remove("fs-2", "fs-3");
          if (levels[idx]) document.body.classList.add(levels[idx]);
          btn.textContent = labels[idx];
          btn.classList.toggle("on", idx > 0);
          localStorage.setItem(FS_KEY, levels[idx]);
        }
        btn.addEventListener("click", function () {
          idx = (idx + 1) % levels.length;
          apply();
        });
        apply();
      })();

      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var fcCode = params.get("fc");
      if (!id) { notFound(); return; }

      // 공유 발행 에디션 — fc 파라미터가 명단에 있으면 발행인 표기만 그 FC로 바꾼다.
      // 내용은 원본과 동일하고, 편집장 표기는 항상 안창민이다 (결정 2026-07-20).
      // 명단에 없는 코드는 무시하고 원본 발행인으로 표시한다.
      function loadEdition() {
        if (!fcCode) return Promise.resolve(null);
        return fetch("../../data/care/publishers.json")
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (list) {
            return (Array.isArray(list) ? list : []).find(function (p) { return p["코드"] === fcCode; }) || null;
          })
          .catch(function () { return null; });
      }

      // 목록·본문 모두 서버 우선 → 정적 폴백 (서버가 죽어도 기존 호 열람은 그대로)
      Promise.all([
        window.care.loadIssueList(),
        loadEdition()
      ])
        .then(function (results) {
          var list = results[0];
          var edition = results[1];
          var meta = list.find(function (i) { return i.id === id; });
          if (!meta) { notFound(); return; }
          if (edition && edition["이름"]) {
            meta = Object.assign({}, meta, { "발행인": edition["이름"] });
          }
          document.title = meta["채널"] + " " + (meta["발행인"] || "안창민") + " " + meta["호수"] + "호 - 케어센터";
          return window.care.loadIssueBody(meta)
            .then(function (data) { render(meta, data, list, edition); });
        })
        .catch(notFound);
    })();
  </script>
</body>
</html>
