<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안창민 케어센터 - 마이가디언</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/platform.js"></script>
</head>
<body class="magazine">
  <header class="mag-topbar">
    <a class="mag-home" href="./">
      <svg viewBox="0 0 24 24"><path d="M14 6l-6 6 6 6"/></svg>서재
    </a>
    <span class="mag-top-title" id="top-title">케어센터</span>
    <button type="button" class="font-toggle" id="font-toggle" aria-label="글자 크기 조절">가</button>
  </header>
  <div class="mag-progress" id="mag-progress" style="width:0"></div>

  <main class="issue" id="issue">
    <p class="issue-loading">발행물을 불러오는 중입니다.</p>
  </main>

  <script>
    (function () {
      "use strict";
      var root = document.getElementById("issue");
      var esc = window.mg.esc;

      // 월간 원본의 영문 라벨은 한글 기능 라벨로 표시한다 (데이터는 무변형, 표시만 변환)
      var CAT_DISPLAY = { "HOT ISSUE": "주요 이슈", "LIFESTYLE": "생활", "INSIGHT": "통찰" };
      function displayCat(cat) {
        return CAT_DISPLAY[String(cat || "").toUpperCase()] || cat;
      }

      function pad2(n) { return String(n).padStart(2, "0"); }

      // 발행일 "2026-07-27" → "2026년 7월 27일" (표시만 변환).
      // 주차라벨이 같은 연도를 이미 실었으면 연도를 생략해 발행선 중복을 줄인다.
      function displayDate(iso, weekLabel) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
        if (!m) return iso || "";
        var year = String(weekLabel || "").indexOf(m[1] + "년") === 0 ? "" : m[1] + "년 ";
        return year + Number(m[2]) + "월 " + Number(m[3]) + "일";
      }

      function notFound() {
        document.title = "발행물을 찾을 수 없습니다 - 케어센터";
        root.innerHTML = '<header class="issue-head">'
          + '<p class="issue-masthead">케어센터</p>'
          + '<p class="issue-line">발행물을 찾을 수 없습니다</p>'
          + "</header>"
          + '<div class="issue-missing"><p>주소가 잘못되었거나 아직 발행되지 않은 호입니다.<br>'
          + "전달받은 링크를 다시 확인하시거나 담당 설계사에게 문의해 주십시오.</p>"
          + '<a class="issue-return" href="./">케어센터 서재로 이동</a></div>';
      }

      // 기사 표제 블록 — 킥커(번호·카테고리) → 세리프 표제 → 부제
      function headBlock(a, i, tag) {
        var h = [];
        h.push('<p class="a-kicker"><span class="a-no">' + pad2(i + 1) + "</span>" + esc(displayCat(a["카테고리"])) + "</p>");
        h.push("<" + tag + ' class="a-head">' + esc(a["제목"]) + "</" + tag + ">");
        if (a["부제"]) h.push('<p class="a-standfirst">' + esc(a["부제"]) + "</p>");
        return h.join("");
      }

      // 기사 몸통 — 이미지(figure)·요약·본문·한마디(골드 칼럼 박스)
      function bodyBlock(a, pub) {
        var h = [];
        if (a["이미지"]) {
          h.push('<figure class="a-figure"><img src="../../' + esc(a["이미지"]) + '" alt="" loading="lazy">');
          if (a["이미지캡션"]) h.push("<figcaption>" + esc(a["이미지캡션"]) + "</figcaption>");
          h.push("</figure>");
        }
        var segs = a["본문"] || [];
        var sum = a["요약"] || [];
        if (segs.length) {
          // 본문이 있는 호 — 요약은 표제 아래 요지 박스로
          if (sum.length) {
            h.push('<aside class="a-summary"><p class="label">요약</p>');
            sum.forEach(function (p) { h.push("<p>" + esc(p) + "</p>"); });
            h.push("</aside>");
          }
          h.push('<div class="a-body">');
          segs.forEach(function (seg) {
            h.push(seg.t === "h" ? "<h3>" + esc(seg.x) + "</h3>" : "<p>" + esc(seg.x) + "</p>");
          });
          h.push("</div>");
        } else if (sum.length) {
          // 요약만 있는 호 — 요약이 곧 기사 본문이다
          h.push('<div class="a-body">');
          sum.forEach(function (p) { h.push("<p>" + esc(p) + "</p>"); });
          h.push("</div>");
        }
        var comment = a["한마디"] || [];
        if (comment.length) {
          h.push('<aside class="a-note"><p class="a-note-label">' + esc(pub) + " FC의 한마디</p>");
          comment.forEach(function (p) { h.push("<p>" + esc(p) + "</p>"); });
          h.push('<p class="a-note-sign">' + esc(pub) + " FC</p></aside>");
        }
        return h.join("");
      }

      function render(meta, data, list, edition) {
        document.body.dataset.ch = meta["채널"];
        var pub = meta["발행인"] || "안창민";
        var mast = meta["채널"] + " " + pub;
        var editorLine = "편집장 안창민 FC" + (pub !== "안창민" ? " · 발행 " + esc(pub) + " FC" : "");
        var arts = data["기사"] || [];
        var note = data["편집장의말"] || [];
        var h = [];

        // 지면 헤더 — 제호 → 호수·발행일 → (대표 기사) 킥커 → 표제 → 부제 → 필자
        h.push('<header class="issue-head" id="a1">');
        h.push('<p class="issue-masthead">' + esc(mast) + "</p>");
        h.push('<p class="issue-line">통권 ' + esc(meta["호수"]) + "호 · " + esc(meta["주차라벨"]) + " · " + esc(displayDate(meta["발행일"], meta["주차라벨"])) + " 발행</p>");
        if (arts.length) {
          h.push(headBlock(arts[0], 0, "h1"));
          h.push('<p class="a-byline">' + editorLine + "</p>");
        }
        if (arts.length > 1) {
          h.push('<nav class="issue-toc" aria-label="이번 호 기사">');
          arts.forEach(function (a, i) {
            h.push('<a href="#a' + (i + 1) + '"><span class="a-no">' + pad2(i + 1) + "</span>" + esc(displayCat(a["카테고리"])) + "</a>");
          });
          h.push("</nav>");
        }
        // 표지 이미지는 폴드 직하 1장 — 대표 기사가 자체 이미지를 실으면 중복 질량이라 생략
        if (meta["커버이미지"] && !(arts[0] && arts[0]["이미지"])) {
          h.push('<figure class="a-figure issue-cover"><img src="../../' + esc(meta["커버이미지"]) + '" alt="표지" fetchpriority="high"></figure>');
        }
        h.push("</header>");

        if (note.length) {
          h.push('<section class="issue-note"><p class="issue-note-label">편집장의 말</p>');
          note.forEach(function (p) { h.push("<p>" + esc(p) + "</p>"); });
          h.push('<p class="issue-note-sign">편집장 안창민</p></section>');
        }

        // 기사 — 대표 기사의 표제는 지면 헤더가 이미 실었다
        arts.forEach(function (a, i) {
          h.push('<article class="a' + (i === 0 ? " a-lead" : "") + '"' + (i > 0 ? ' id="a' + (i + 1) + '"' : "") + ">");
          if (i > 0) h.push(headBlock(a, i, "h2"));
          h.push(bodyBlock(a, pub));
          h.push("</article>");
        });

        // 지면 말미 — 필자 서명 → 다음 호 → 판권
        var org = edition ? (edition["소속"] || "") : "신한라이프 하랑지점";
        h.push('<footer class="issue-end">');
        h.push('<div class="sig-card"><p class="sig-name">' + esc(pub) + ' FC</p>');
        h.push('<p class="sig-role">' + (pub === "안창민" ? "편집장 · " : "발행 · ") + esc(org) + "</p></div>");

        // 다음 호 — 같은 채널의 실제 다음 발행분이 서재에 있을 때만 (실데이터 없으면 생략)
        var next = null;
        (list || []).forEach(function (i) {
          if (i["상태"] === "초안" || i["채널"] !== meta["채널"]) return;
          if ((i["발행일"] || "") <= (meta["발행일"] || "")) return;
          if (!next || (i["발행일"] || "") < (next["발행일"] || "")) next = i;
        });
        if (next) {
          var fc = new URLSearchParams(window.location.search).get("fc");
          var href = "issue.html?id=" + encodeURIComponent(next.id)
            + (edition && fc ? "&fc=" + encodeURIComponent(fc) : "");
          h.push('<a class="next-issue" href="' + href + '">');
          h.push('<span class="next-label">다음 호</span>');
          h.push('<span class="next-title">' + esc(next["제목"]) + "</span>");
          h.push('<span class="next-meta">통권 ' + esc(next["호수"]) + "호 · " + esc(next["주차라벨"]) + "</span></a>");
        }

        h.push('<div class="colophon">');
        h.push('<p class="colophon-title">' + esc(mast) + "</p>");
        h.push("<p>통권 " + esc(meta["호수"]) + "호 · " + esc(meta["주차라벨"]) + " · " + editorLine + "</p>");
        h.push("<p>본 콘텐츠는 정보 제공 목적이며 개별 상품 권유가 아닙니다. 문의는 담당 설계사에게 연락해 주십시오.</p>");
        h.push('<a class="issue-return" href="./">케어센터 서재로</a>');
        h.push("</div></footer>");

        root.innerHTML = h.join("");
        document.getElementById("top-title").textContent = mast + " · 통권 " + meta["호수"] + "호";
        initProgress();
      }

      // 읽기 진행 표시줄 — 세로 스크롤 기준
      function initProgress() {
        var bar = document.getElementById("mag-progress");
        function update() {
          var max = document.documentElement.scrollHeight - window.innerHeight;
          var p = max > 0 ? Math.min(1, window.scrollY / max) : 1;
          bar.style.width = (p * 100) + "%";
        }
        window.addEventListener("scroll", update, { passive: true });
        window.addEventListener("resize", update);
        update();
      }

      // 글자 크기 조절: 보통 → 크게 → 아주 크게 (저장됨)
      (function () {
        var FS_KEY = "mg_care_fs";
        var btn = document.getElementById("font-toggle");
        var levels = ["", "fs-2", "fs-3"];
        var labels = ["가", "가+", "가++"];
        var idx = Math.max(0, levels.indexOf(localStorage.getItem(FS_KEY) || ""));
        function apply() {
          document.body.classList.remove("fs-2", "fs-3");
          if (levels[idx]) document.body.classList.add(levels[idx]);
          btn.textContent = labels[idx];
          btn.classList.toggle("on", idx > 0);
          localStorage.setItem(FS_KEY, levels[idx]);
        }
        btn.addEventListener("click", function () {
          idx = (idx + 1) % levels.length;
          apply();
        });
        apply();
      })();

      var params = new URLSearchParams(window.location.search);
      var id = params.get("id");
      var fcCode = params.get("fc");
      if (!id) { notFound(); return; }

      // 공유 발행 에디션 — fc 파라미터가 명단에 있으면 발행인 표기만 그 FC로 바꾼다.
      // 내용은 원본과 동일하고, 편집장 표기는 항상 안창민이다 (결정 2026-07-20).
      // 명단에 없는 코드는 무시하고 원본 발행인으로 표시한다.
      function loadEdition() {
        if (!fcCode) return Promise.resolve(null);
        return fetch("../../data/care/publishers.json")
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (list) {
            return (Array.isArray(list) ? list : []).find(function (p) { return p["코드"] === fcCode; }) || null;
          })
          .catch(function () { return null; });
      }

      Promise.all([
        fetch("../../data/care/issues.json").then(function (r) { return r.json(); }),
        loadEdition()
      ])
        .then(function (results) {
          var list = Array.isArray(results[0]) ? results[0] : [];
          var edition = results[1];
          var meta = list.find(function (i) { return i.id === id; });
          if (!meta) { notFound(); return; }
          if (edition && edition["이름"]) {
            meta = Object.assign({}, meta, { "발행인": edition["이름"] });
          }
          document.title = meta["채널"] + " " + (meta["발행인"] || "안창민") + " " + meta["호수"] + "호 - 케어센터";
          return fetch("../../" + meta["본문파일"])
            .then(function (r) {
              if (!r.ok) throw new Error("본문 없음");
              return r.json();
            })
            .then(function (data) { render(meta, data, list, edition); });
        })
        .catch(notFound);
    })();
  </script>
</body>
</html>
