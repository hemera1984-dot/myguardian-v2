<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서재 - 안창민 케어센터</title>
  <meta name="theme-color" content="#F4F1EA">
  <meta name="description" content="보험·경제·상속을 쉽게 풀어 전하는 발행물을 모아 둔 서재입니다.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="안창민 케어센터">
  <meta property="og:title" content="안창민 케어센터 서재">
  <meta property="og:description" content="보험·경제·상속을 쉽게 풀어 전하는 발행물을 모아 둔 서재입니다.">
  <meta property="og:image" content="https://app.insurguard.life/web/assets/img/hero-care.jpg">
  <meta property="og:url" content="https://app.insurguard.life/web/care/">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/care.js"></script>
</head>
<!-- 고객 전용 서재. 플랫폼 셸(사이드바·상단바·계정)을 쓰지 않는다 —
     고객은 잡지만 알고 플랫폼을 모른다. 발행 도구는 shelf.html(FC용)에 있다. -->
<body class="shelf-body">
  <main class="shelf-main">
    <div class="shelf-page">
      <header class="shelf-hero">
        <div class="shelf-hero__band" aria-hidden="true"></div>
        <div class="shelf-hero__main">
          <p class="shelf-hero__kicker">케어센터</p>
          <h1 class="shelf-hero__title">서재</h1>
          <p class="shelf-hero__deck">지난 호를 모두 모아 두었습니다. 표지를 누르면 그 호가 열립니다.</p>
          <div class="shelf-hero__circle" aria-hidden="true"></div>
          <div class="shelf-hero__triangle" aria-hidden="true"></div>
        </div>
      </header>

      <div class="pill-tabs shelf-tabs" role="tablist" aria-label="채널">
        <button type="button" class="active" data-ch="">전체</button>
        <button type="button" data-ch="일일">일일 안창민</button>
        <button type="button" data-ch="주간">주간 안창민</button>
        <button type="button" data-ch="월간">월간 안창민</button>
      </div>

      <div id="issue-list">
        <div class="placeholder-panel">발행물을 불러오는 중입니다.</div>
      </div>
    </div>
  </main>

  <script>
    (function () {
      "use strict";
      var care = window.care;
      var esc = care.esc;
      var ALL = [];
      var channel = "";
      var publisher = "";
      // 공유 발행 에디션 — ?fc=코드로 열면 이 서재 전체가 그 FC의 제호로 보인다.
      // 고객은 로그인하지 않으므로 발행인 표기는 링크가 실어 나른다 (결정 2026-07-20).
      var fcCode = new URLSearchParams(window.location.search).get("fc");
      var edition = null;

      // 에디션이면 발행인 표기를 그 FC로 바꾼다. 내용·편집장(안창민)은 그대로다.
      function pubName(issue) {
        return edition ? edition["이름"] : (issue["발행인"] || "안창민");
      }

      function issueHref(id) {
        return "issue.html?id=" + encodeURIComponent(id)
          + (edition ? "&fc=" + encodeURIComponent(edition["코드"]) : "");
      }

      // 발행일 "2026-07-27" → "2026년 7월 27일"
      function dateText(iso) {
        var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(iso || ""));
        return m ? m[1] + "년 " + Number(m[2]) + "월 " + Number(m[3]) + "일" : String(iso || "");
      }

      // 표지 카드 한 장 — 표지가 없는 호는 care.coverHtml이 바우하우스 표지를 만든다
      function coverCard(i, latest) {
        return '<article class="shelf__item' + (latest ? " is-latest" : "") + '">'
          + '<a class="shelf__link" href="' + issueHref(i.id) + '">'
          + '<span class="shelf__cover">' + care.coverHtml(i, pubName(i))
          + (latest ? '<span class="shelf__badge">최신호</span>' : "") + "</span>"
          + '<span class="shelf__no">' + esc(i["호수"]) + "호</span>"
          + '<span class="shelf__name">' + esc(i["제목"]) + "</span>"
          + '<span class="shelf__date">' + esc(i["주차라벨"] || dateText(i["발행일"])) + "</span></a>"
          + "</article>";
      }

      // 서가 — 채널별로 한 칸씩. 최신호는 앞줄에 크게 세운다.
      function render() {
        var box = document.getElementById("issue-list");
        var list = care.sortByDate(care.published(ALL).filter(function (i) {
          if (channel && i["채널"] !== channel) return false;
          if (publisher && (i["발행인"] || "안창민") !== publisher) return false;
          return true;
        }));
        if (!list.length) {
          box.innerHTML = '<div class="placeholder-panel">아직 발행물이 없습니다. 첫 호가 준비되는 대로 서재에 꽂힙니다.</div>';
          return;
        }
        var order = ["월간", "주간", "일일"];
        list.forEach(function (i) { if (order.indexOf(i["채널"]) < 0) order.push(i["채널"]); });
        box.className = "shelf-wrap";
        box.innerHTML = order.map(function (ch, n) {
          var rows = list.filter(function (i) { return i["채널"] === ch; });
          if (!rows.length) return "";
          return '<section class="shelf shelf--' + (n % 3 + 1) + '">'
            + '<div class="shelf__head"><h2 class="shelf__title">' + esc(ch) + " " + esc(pubName(rows[0])) + "</h2>"
            + '<span class="shelf__count">' + rows.length + "권</span></div>"
            + '<div class="shelf__grid">'
            + rows.slice(0, ch === "일일" ? 10 : rows.length)
                .map(function (i, idx) { return coverCard(i, idx === 0); }).join("")
            + "</div>"
            + (ch === "일일" && rows.length > 10
                ? '<details class="shelf__more"><summary>지난 일일 ' + (rows.length - 10) + "권 더 보기</summary>"
                  + '<div class="shelf__grid">'
                  + rows.slice(10).map(function (i) { return coverCard(i, false); }).join("")
                  + "</div></details>"
                : "")
            + "</section>";
        }).join("");
      }

      // 명단에 없는 코드는 무시하고 원본 발행인으로 표시한다 (issue.html과 같은 규칙)
      function loadEdition() {
        if (!fcCode) return Promise.resolve(null);
        return care.loadPublishers().then(function (list) {
          return list.find(function (p) { return p["코드"] === fcCode; }) || null;
        });
      }

      // 에디션 서재는 그 FC 한 사람의 제호로 보여준다 — 채널 탭·발행인 필터를 그에 맞춘다
      function applyEditionLabels() {
        if (!edition) return;
        channelTabs.querySelectorAll("button[data-ch]").forEach(function (b) {
          if (b.dataset.ch) b.textContent = b.dataset.ch + " " + edition["이름"];
        });
      }

      Promise.all([
        care.loadIssueList(),
        loadEdition()
      ])
        .then(function (res) {
          edition = res[1];
          ALL = res[0];
          applyEditionLabels();
          if (!edition) buildPublisherTabs(); // 개인 에디션 서재에는 발행인 필터를 두지 않는다
          render();
        })
        .catch(function () {
          document.getElementById("issue-list").innerHTML =
            '<div class="placeholder-panel">발행물을 불러오지 못했습니다.</div>';
        });

      var channelTabs = document.querySelector(".pill-tabs.shelf-tabs");
      channelTabs.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          channelTabs.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          channel = btn.dataset.ch;
          render();
        });
      });

      // 발행인이 2명 이상일 때만 발행인 필터를 노출한다
      function buildPublisherTabs() {
        var pubs = [];
        care.published(ALL).forEach(function (i) {
          var p = i["발행인"] || "안창민";
          if (pubs.indexOf(p) < 0) pubs.push(p);
        });
        if (pubs.length < 2) return;
        var row = document.createElement("div");
        row.className = "pill-tabs shelf-tabs";
        row.setAttribute("aria-label", "발행인");
        row.innerHTML = '<button type="button" class="active" data-pub="">전체 발행인</button>'
          + pubs.map(function (p) {
              return '<button type="button" data-pub="' + esc(p) + '">' + esc(p) + " FC</button>";
            }).join("");
        channelTabs.parentNode.insertBefore(row, channelTabs.nextSibling);
        row.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            row.querySelectorAll("button").forEach(function (b) {
              b.classList.toggle("active", b === btn);
            });
            publisher = btn.dataset.pub;
            render();
          });
        });
      }
    })();
  </script>
</body>
</html>
