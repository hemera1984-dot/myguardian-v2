<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>서재 - 케어센터</title>
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="../assets/platform.css">
  <link rel="stylesheet" href="../assets/style.css">
  <script src="../assets/platform.js"></script>
  <script src="../assets/auth.js"></script>
  <script src="../assets/care.js"></script>
</head>
<body class="platform">
  <aside class="platform-sidebar" id="platform-sidebar">
    <a class="platform-brand" href="../" aria-label="마이가디언 홈"><span class="brand-mark"><img src="../assets/logo.svg" alt=""></span><span><span class="brand-name">마이가디언</span><span class="brand-caption">FC 업무 플랫폼</span></span></a>
    <nav class="platform-nav" aria-label="케어센터 메뉴">
      <p class="nav-group-label">케어센터</p>
      <a href="desk.html">발행 데스크</a>
      <a class="active" href="./">서재</a>
      <p class="nav-group-label">플랫폼</p>
      <a href="../">마이가디언 홈</a>
    </nav>
    <div class="sidebar-status"><strong>편집장 안창민 FC</strong><span>주간·월간 발행 플랫폼</span></div>
  </aside>
  <div class="platform-overlay" id="platform-overlay"></div>

  <div class="platform-shell">
    <header class="platform-topbar">
      <button class="mobile-menu" id="mobile-menu" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span></button>
      <span class="mobile-brand">케어센터</span>
      <span class="topbar-context">케어센터 · 서재</span>
      <span class="topbar-note">발행된 모든 호를 언제든 열람</span>
    </header>

    <main class="platform-main">
      <div class="photo-hero">
        <img src="../assets/img/hero-care.jpg" alt="" fetchpriority="high">
        <div class="photo-hero-text">
          <h1 class="serif">케어센터 서재</h1>
          <p>매주 월요일, 한 주를 여는 보험·경제 이야기. 발행된 모든 호를 언제든 꺼내 읽을 수 있습니다.</p>
        </div>
      </div>

      <div class="section">
        <div class="compose-panel" id="compose" hidden>
          <h3 id="compose-title">카톡 문구</h3>
          <textarea id="compose-text" aria-label="카톡 발송 문구"></textarea>
          <div class="compose-actions">
            <button class="btn btn-primary" type="button" id="compose-copy">복사하기</button>
            <button class="btn" type="button" id="compose-close">닫기</button>
          </div>
        </div>

        <div class="latest-duo" id="latest-duo"></div>

        <div class="pill-tabs" role="tablist" aria-label="채널">
          <button type="button" class="active" data-ch="">전체</button>
          <button type="button" data-ch="주간">주간 안창민</button>
          <button type="button" data-ch="월간">월간 안창민</button>
        </div>

        <div class="arch-list" id="issue-list">
          <div class="placeholder-panel">발행물을 불러오는 중입니다.</div>
        </div>
      </div>
    </main>

    <footer class="platform-footer">마이가디언 v2</footer>
  </div>

  <script>
    (function () {
      "use strict";
      var care = window.care;
      var esc = care.esc;
      var ALL = [];
      var channel = "";
      var publisher = "";
      // 공유 발행 에디션 — ?fc=코드로 열면 이 서재 전체가 그 FC의 제호로 보인다.
      // 고객은 로그인하지 않으므로 발행인 표기는 링크가 실어 나른다 (결정 2026-07-20).
      var fcCode = new URLSearchParams(window.location.search).get("fc");
      var edition = null;

      care.bindCompose();

      // 에디션이면 발행인 표기를 그 FC로 바꾼다. 내용·편집장(안창민)은 그대로다.
      function pubName(issue) {
        return edition ? edition["이름"] : (issue["발행인"] || "안창민");
      }

      function issueHref(id) {
        return "issue.html?id=" + encodeURIComponent(id)
          + (edition ? "&fc=" + encodeURIComponent(edition["코드"]) : "");
      }

      function render() {
        var box = document.getElementById("issue-list");
        var list = care.sortByDate(care.published(ALL).filter(function (i) {
          if (channel && i["채널"] !== channel) return false;
          if (publisher && (i["발행인"] || "안창민") !== publisher) return false;
          return true;
        }));
        if (!list.length) {
          box.innerHTML = '<div class="placeholder-panel">아직 발행물이 없습니다. 첫 호가 준비되는 대로 서재에 꽂힙니다.</div>';
          return;
        }
        box.innerHTML = list.map(function (i, idx) {
          var href = issueHref(i.id);
          var pub = pubName(i);
          var cover = i["커버이미지"]
            ? '<span class="arch-cover"><img src="' + esc(care.mediaSrc(i["커버이미지"])) + '" alt="" loading="lazy"></span>'
            : '<span class="arch-cover no-img ch-' + esc(i["채널"]) + '">' + esc(i["채널"]) + "<br>" + esc(i["호수"]) + "호</span>";
          return '<article class="arch-row">'
            + '<a class="arch-main" href="' + href + '">' + cover
            + '<span class="arch-text">'
            + '<span class="arch-kicker">' + esc(i["채널"]) + " " + esc(pub) + " " + esc(i["호수"]) + "호 · " + esc(i["주차라벨"] || i["발행일"]) + "</span>"
            + '<span class="arch-title">' + esc(i["제목"]) + "</span></span></a>"
            + '<button class="shelf-kakao" type="button" data-idx="' + idx + '">카톡 문구</button>'
            + "</article>";
        }).join("");
        box.querySelectorAll("button[data-idx]").forEach(function (btn) {
          btn.addEventListener("click", function () {
            care.openCompose(list[Number(btn.dataset.idx)], edition);
          });
        });
      }

      // 명단에 없는 코드는 무시하고 원본 발행인으로 표시한다 (issue.html과 같은 규칙)
      function loadEdition() {
        if (!fcCode) return Promise.resolve(null);
        return fetch("../../data/care/publishers.json")
          .then(function (r) { return r.ok ? r.json() : []; })
          .then(function (list) {
            return (Array.isArray(list) ? list : []).find(function (p) { return p["코드"] === fcCode; }) || null;
          })
          .catch(function () { return null; });
      }

      // 에디션 서재는 그 FC 한 사람의 제호로 보여준다 — 채널 탭·발행인 필터를 그에 맞춘다
      function applyEditionLabels() {
        if (!edition) return;
        channelTabs.querySelectorAll("button[data-ch]").forEach(function (b) {
          if (b.dataset.ch) b.textContent = b.dataset.ch + " " + edition["이름"];
        });
      }

      // 서버 발행분 + 정적 저장소 병합 (서버가 죽어도 정적 열람은 그대로)
      Promise.all([
        care.loadIssueList(),
        loadEdition()
      ])
        .then(function (res) {
          edition = res[1];
          ALL = res[0];
          applyEditionLabels();
          if (!edition) buildPublisherTabs(); // 개인 에디션 서재에는 발행인 필터를 두지 않는다
          buildLatestDuo();
          render();
        })
        .catch(function () {
          document.getElementById("issue-list").innerHTML =
            '<div class="placeholder-panel">발행물을 불러오지 못했습니다.</div>';
        });

      var channelTabs = document.querySelector(".pill-tabs");
      channelTabs.querySelectorAll("button").forEach(function (btn) {
        btn.addEventListener("click", function () {
          channelTabs.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
          });
          channel = btn.dataset.ch;
          render();
        });
      });

      // 채널별 최신호 직행 배너 — 서재를 뒤지지 않고 바로 읽는다
      function buildLatestDuo() {
        var duo = document.getElementById("latest-duo");
        var html = ["주간", "월간"].map(function (ch) {
          var i = care.latestByChannel(ALL, ch);
          if (!i) return "";
          var bg = i["커버이미지"] ? ' style="background-image:url(' + esc(care.mediaSrc(i["커버이미지"])) + ')"' : "";
          return '<a class="latest-card" href="' + issueHref(i.id) + '">'
            + '<span class="latest-bg"' + bg + "></span>"
            + '<span class="latest-body"><span class="latest-ch">' + esc(ch) + " " + esc(pubName(i)) + " · " + esc(i["호수"]) + "호</span>"
            + '<span class="latest-title serif">' + esc(i["제목"]) + "</span>"
            + '<span class="latest-go">최신호 바로 읽기</span></span></a>';
        }).join("");
        duo.innerHTML = html;
      }

      // 발행인이 2명 이상일 때만 발행인 필터를 노출한다
      function buildPublisherTabs() {
        var pubs = [];
        care.published(ALL).forEach(function (i) {
          var p = i["발행인"] || "안창민";
          if (pubs.indexOf(p) < 0) pubs.push(p);
        });
        if (pubs.length < 2) return;
        var row = document.createElement("div");
        row.className = "pill-tabs";
        row.setAttribute("aria-label", "발행인");
        row.innerHTML = '<button type="button" class="active" data-pub="">전체 발행인</button>'
          + pubs.map(function (p) {
              return '<button type="button" data-pub="' + esc(p) + '">' + esc(p) + " FC</button>";
            }).join("");
        channelTabs.parentNode.insertBefore(row, channelTabs.nextSibling);
        row.querySelectorAll("button").forEach(function (btn) {
          btn.addEventListener("click", function () {
            row.querySelectorAll("button").forEach(function (b) {
              b.classList.toggle("active", b === btn);
            });
            publisher = btn.dataset.pub;
            render();
          });
        });
      }
    })();
  </script>
</body>
</html>
