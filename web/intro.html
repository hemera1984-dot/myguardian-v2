<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <title>마이가디언</title>
  <meta name="theme-color" content="#0a1d37">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: "Pretendard", "Pretendard Variable", sans-serif;
      background: #0a1d37;
      color: #fff;
      overflow: hidden;
      word-break: keep-all;
      -webkit-font-smoothing: antialiased;
    }

    /* 조용히 흐르는 배경 (영상 대신) */
    .bg { position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(1100px 640px at 70% 20%, rgba(0,166,199,0.16), transparent 60%),
        radial-gradient(950px 760px at 22% 92%, rgba(7,88,214,0.22), transparent 60%),
        linear-gradient(160deg, #0a1d37, #102a4e 55%, #0a1d37);
    }
    .bg::after { content:""; position:absolute; inset:0;
      background: linear-gradient(115deg, transparent 45%, rgba(255,255,255,0.045) 50%, transparent 55%);
      transform: translateX(-50%); animation: sweep 11s ease-in-out infinite; }
    @keyframes sweep { 0%,100%{transform:translateX(-50%)} 50%{transform:translateX(50%)} }

    .top { position: absolute; top: 26px; left:0; right:0; z-index:3;
      display:flex; justify-content:center; align-items:center; gap:9px;
      opacity:0; animation: fade 0.8s ease 0.2s forwards; }
    .top img { width:26px; height:26px; display:block; }
    .top span { font-size:13px; font-weight:700; letter-spacing:0.02em; color:rgba(255,255,255,0.7); }

    .page { position:relative; z-index:2; height:100%;
      display:flex; flex-direction:column; align-items:center; justify-content:center; gap:38px; padding:32px; }

    /* 키네틱 타이포 무대 */
    .type { text-align:center; min-height: 34vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }
    .line { opacity:0; }
    .kicker { font-size: clamp(14px,2.4vw,18px); font-weight:600; letter-spacing:0.06em;
      color:#43c8df; animation: rise 0.7s ease 0.5s forwards; }
    .title { font-size: clamp(44px,9vw,88px); font-weight:800; letter-spacing:-0.03em; line-height:1.05;
      margin: 10px 0 4px; animation: rise 0.8s ease 0.9s forwards; }
    .desc { font-size: clamp(16px,3vw,24px); font-weight:500; color:rgba(255,255,255,0.82);
      overflow:hidden; }
    .desc .seg { display:inline-block; opacity:0; transform: translateY(12px); }
    .desc .seg.a { animation: rise 0.6s ease 1.6s forwards; }
    .desc .seg.b { animation: rise 0.6s ease 2.1s forwards; }
    .desc .dot { color:#43c8df; margin:0 2px; }

    @keyframes rise { from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none} }
    @keyframes fade { to{opacity:1} }

    .actions { display:flex; flex-direction:column; gap:12px; align-items:center;
      opacity:0; animation: rise 0.7s ease 2.7s forwards; }
    .actions-row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
    .status-note { max-width:420px; text-align:center; font-size:14px; line-height:1.65;
      color:rgba(255,255,255,0.78); }
    .status-note strong { display:block; margin-bottom:4px; font-size:15px; color:#fff; }
    .status-note.warn strong { color:#ffb4a2; }
    .btn { display:inline-flex; align-items:center; gap:10px; height:52px; padding:0 26px;
      border-radius:8px; font:inherit; font-size:15px; font-weight:700; cursor:pointer;
      border:1px solid transparent; text-decoration:none;
      transition: background-color 0.16s ease, border-color 0.16s ease; }
    .btn-google { background:#fff; color:#1f2937; }
    .btn-google:hover { background:#f1f3f5; }
    .btn-enter { background:#0758d6; color:#fff; }
    .btn-enter:hover { background:#0648ad; }
    .btn-ghost { background:transparent; color:rgba(255,255,255,0.78); border-color:rgba(255,255,255,0.25); }
    .btn-ghost:hover { border-color:rgba(255,255,255,0.5); color:#fff; }
    .btn svg { width:18px; height:18px; }

    @media (max-width:640px) {
      .actions { flex-direction:column; align-items:stretch; width:min(100%,320px); }
      .btn { justify-content:center; width:100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg::after { animation:none; }
      .line, .top, .actions, .desc .seg { animation:none !important; opacity:1 !important; transform:none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <div class="top"><img src="assets/logo.svg" alt=""><span>마이가디언</span></div>

  <main class="page">
    <div class="type">
      <p class="line kicker">설계사를 위한</p>
      <h1 class="line title">마이가디언</h1>
      <p class="line desc"><span class="seg a">고객관리부터</span> <span class="seg b">팀원관리까지<span class="dot">.</span></span></p>
    </div>

    <div class="actions" id="actions"><!-- 상태에 따라 채워짐 --></div>
  </main>

  <script src="assets/auth.js"></script>
  <script>
    (function () {
      "use strict";
      var actions = document.getElementById("actions");

      function el(tag, className, text) {
        var n = document.createElement(tag);
        if (className) n.className = className;
        if (text != null) n.textContent = text;
        return n;
      }

      function clear() { actions.textContent = ""; }

      function note(title, body, warn) {
        var p = el("p", "status-note" + (warn ? " warn" : ""));
        p.appendChild(el("strong", null, title));
        p.appendChild(document.createTextNode(body));
        return p;
      }

      function row() {
        var d = el("div", "actions-row");
        actions.appendChild(d);
        return d;
      }

      function signOutButton(label) {
        var b = el("button", "btn btn-ghost", label || "다른 계정으로");
        b.type = "button";
        b.addEventListener("click", function () {
          window.mgAuth.signOut().then(function () { location.reload(); });
        });
        return b;
      }

      // 상태별 화면 — 승인만 안으로 보낸다. 대기·정지는 안내에서 멈춘다.
      function showAccount(account) {
        clear();
        var status = account["상태"];
        if (status === "승인") {
          var r = row();
          var enter = el("a", "btn btn-enter", "메인으로 들어가기");
          enter.href = "index.html";
          r.appendChild(enter);
          r.appendChild(signOutButton());
          return;
        }
        if (status === "정지") {
          actions.appendChild(note("이용이 중지된 계정입니다",
            "관리자에게 문의해 주세요. (" + account["이메일"] + ")", true));
          row().appendChild(signOutButton());
          return;
        }
        actions.appendChild(note("승인 대기 중입니다",
          "관리자가 승인하면 바로 이용할 수 있습니다. 승인 후 이 화면을 새로고침해 주세요. ("
          + account["이메일"] + ")"));
        var r2 = row();
        var again = el("button", "btn btn-ghost", "새로고침");
        again.type = "button";
        again.addEventListener("click", function () { location.reload(); });
        r2.appendChild(again);
        r2.appendChild(signOutButton());
      }

      function showLogin(message) {
        clear();
        if (message) actions.appendChild(note("로그인할 수 없습니다", message, true));
        var holder = el("div");
        actions.appendChild(holder);
        window.mgAuth.renderButton(holder, showAccount, function (err) {
          showLogin(err && err.message ? err.message : "잠시 후 다시 시도해 주세요.");
        }).catch(function () {
          clear();
          actions.appendChild(note("구글 로그인을 불러오지 못했습니다",
            "네트워크 상태를 확인한 뒤 새로고침해 주세요.", true));
        });
      }

      // 기존 세션이 있으면 서버에 물어 상태를 확인하고, 없으면 로그인 버튼을 그린다
      window.mgAuth.me()
        .then(function (info) { info ? showAccount(info["계정"]) : showLogin(); })
        .catch(function () { showLogin("인증 서버에 연결하지 못했습니다."); });
    })();
  </script>
</body>
</html>
