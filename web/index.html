<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <title>마이가디언</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="assets/platform.css">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#481820">
  <script src="assets/platform.js"></script>
  <script src="assets/auth.js"></script>
  <style>
    /* ── 홈 = 「오늘」 (2026-10-04 개편) ─────────────────────────────────────
       조사 4갈래(국내 설계사 앱·해외 CRM·업무 SaaS·현장 영업 앱) + 클로드·코덱스 교차 진단 + 시안 2판 확정.
       메뉴 목록(레일과 같은 내용)을 걷고, 아침에 열면 오늘 누구를 만나고 누구에게 연락할지가 먼저 보이게 했다.
       지킨 것: 괘선 두 단계(2px 잉크·1px 헤어라인), 서체 하나, 색은 신호로만. 데이터가 없는 칸은 만들지 않는다.
       움직임: 색 0.14초, 서랍·알림만 0.2초 transform·opacity. */
    .platform-main { width: min(1240px, calc(100% - 64px)); padding: 24px 0 72px; }
    .num { font-variant-numeric: tabular-nums; }

    .global-search { margin-top: 0; max-width: 560px; }
    body.platform .global-search input {
      border: 1px solid var(--platform-line-strong); border-radius: 4px; background: #fff;
      padding: 10px 14px 10px 36px; font-size: 14px;
    }
    body.platform .global-search input:focus { border-color: var(--platform-ink); outline: none; }
    .global-search::before { left: 13px; }
    .global-search::after { left: 27px; }
    .search-suggest .suggest-empty strong { display: block; font-weight: 600; color: var(--platform-ink); }
    .search-suggest .suggest-empty span { display: block; margin-top: 4px; color: var(--platform-muted); text-wrap: pretty; }

    .h-mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 24px; margin-top: 22px; padding-bottom: 18px; border-bottom: 2px solid var(--platform-ink); }
    .h-mast h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.2; }
    .h-sum { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 8px 0 0; font-size: 14px; color: var(--platform-muted); }
    .h-sum b { color: var(--platform-ink); font-weight: 700; }
    .h-sum .due { color: var(--platform-blue); }
    .h-acts { display: flex; gap: 8px; flex-shrink: 0; }
    .h-btn {
      display: inline-flex; align-items: center; justify-content: center; min-height: 40px; padding: 0 16px;
      border: 1px solid var(--platform-line-strong); border-radius: 4px; background: #fff; color: var(--platform-ink);
      font: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: background-color .14s, border-color .14s, color .14s;
    }
    .h-btn:hover { border-color: var(--platform-ink); }
    .h-btn.primary { background: var(--platform-blue); border-color: var(--platform-blue); color: #fff; }
    .h-btn.primary:hover { background: var(--platform-blue-dark); border-color: var(--platform-blue-dark); }
    .h-btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; }

    .h-gate { margin: 20px 0 0; padding: 18px 0; border-bottom: 1px solid var(--platform-line); font-size: 14px; color: var(--platform-muted); }
    .h-gate a { color: var(--platform-blue); font-weight: 700; }

    .h-next { display: grid; grid-template-columns: 150px minmax(0, 1fr) auto; gap: 24px; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--platform-line); }
    .h-next .lbl { font-size: 12px; font-weight: 700; color: var(--platform-muted); }
    .h-next .when { margin-top: 4px; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .h-next .when.today { color: var(--platform-blue); }
    .h-next h2 { margin: 0; font-size: 20px; font-weight: 800; letter-spacing: -0.03em; }
    .h-next h2 span { margin-left: 8px; font-size: 14px; font-weight: 600; color: var(--platform-muted); letter-spacing: 0; }
    .h-next p { margin: 4px 0 0; font-size: 13px; color: var(--platform-muted); }

    .h-grid { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 0 48px; margin-top: 32px; }
    .h-sec { min-width: 0; }
    .h-sec-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--platform-ink); }
    .h-sec-h h2 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.035em; }
    .h-sec-h a { font-size: 13px; font-weight: 700; color: var(--platform-muted); transition: color .14s; }
    .h-sec-h a:hover { color: var(--platform-blue); }
    .h-empty { padding: 18px 0; font-size: 14px; color: var(--platform-muted); border-bottom: 1px solid var(--platform-line); }

    .h-day { display: grid; grid-template-columns: 96px minmax(0, 1fr); border-bottom: 1px solid var(--platform-line); }
    .h-day-h { padding: 14px 0; }
    .h-day-h b { display: block; font-size: 14px; font-weight: 800; }
    .h-day-h span { font-size: 12px; color: var(--platform-faint); }
    .h-day-h.today b, .h-day-h.late b { color: var(--platform-blue); }
    .h-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 14px; min-height: 56px; padding: 8px 0; border-top: 1px solid var(--platform-line); transition: color .14s; }
    .h-row:first-child { border-top: 0; }
    .h-who { min-width: 0; }
    .h-who a { font-size: 15px; font-weight: 750; transition: color .14s; }
    .h-who a:hover { color: var(--platform-blue); }
    .h-who .k { margin-left: 8px; font-size: 13px; color: var(--platform-muted); }
    .h-who .d { display: block; font-size: 12px; color: var(--platform-faint); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .h-do { display: flex; gap: 6px; }
    .h-row.done { color: var(--platform-faint); }
    .h-row.done .h-who a { color: var(--platform-faint); text-decoration: line-through; text-decoration-color: var(--platform-line-strong); }
    .h-row.done .h-do { visibility: hidden; }

    .h-contact { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 2px 14px; min-height: 58px; padding: 9px 0; border-bottom: 1px solid var(--platform-line); }
    .h-contact a.n { font-size: 15px; font-weight: 750; transition: color .14s; }
    .h-contact a.n:hover { color: var(--platform-blue); }
    .h-contact .why { display: block; font-size: 12px; color: var(--platform-muted); }
    .h-contact .why b { font-weight: 700; color: var(--platform-ink); }
    .h-contact .h-do { grid-row: 1 / 3; grid-column: 2; }

    .h-figs { display: grid; grid-template-columns: repeat(4, 1fr); margin-top: 40px; border-top: 2px solid var(--platform-ink); border-bottom: 1px solid var(--platform-line); }
    .h-fig { padding: 18px 20px 16px; border-left: 1px solid var(--platform-line); }
    .h-fig:first-child { border-left: 0; padding-left: 0; }
    .h-fig .k { font-size: 12px; font-weight: 700; color: var(--platform-muted); }
    .h-fig .v { margin: 6px 0 2px; font-size: 34px; font-weight: 800; letter-spacing: -0.04em; line-height: 1.1; }
    .h-fig .v small { margin-left: 3px; font-size: 13px; font-weight: 600; color: var(--platform-muted); letter-spacing: 0; }
    .h-fig .d { font-size: 12px; color: var(--platform-faint); }

    .h-trio { display: grid; grid-template-columns: repeat(var(--cells, 3), minmax(0, 1fr)); margin-top: 40px; border-top: 2px solid var(--platform-ink); }
    .h-cell { padding: 16px 24px 8px; border-left: 1px solid var(--platform-line); min-width: 0; }
    .h-cell:first-child { border-left: 0; padding-left: 0; }
    .h-cell:last-child { padding-right: 0; }
    .h-cell .eb { font-size: 12px; font-weight: 800; color: var(--platform-muted); }
    .h-cell h3 { margin: 6px 0 4px; font-size: 18px; font-weight: 800; letter-spacing: -0.035em; }
    .h-cell p { margin: 0; font-size: 13px; color: var(--platform-muted); }
    .h-cell .due { color: var(--platform-blue); font-weight: 800; }
    .h-bar { height: 3px; margin: 12px 0 8px; background: var(--platform-line); }
    .h-bar i { display: block; height: 100%; background: var(--platform-ink); }
    .h-cell ul { margin: 8px 0 0; padding: 0; list-style: none; }
    .h-cell li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 0; border-top: 1px solid var(--platform-line); font-size: 13px; }
    .h-cell li:first-child { border-top: 0; }
    .h-cell li a { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; transition: color .14s; }
    .h-cell li a:hover { color: var(--platform-blue); }
    .h-cell li span { color: var(--platform-faint); white-space: nowrap; }
    .h-cell .go { display: inline-flex; align-items: center; min-height: 36px; margin-top: 6px; font-size: 13px; font-weight: 800; color: var(--platform-ink); transition: color .14s; }
    .h-cell .go:hover { color: var(--platform-blue); }

    /* 서랍 — 오른쪽(폰은 아래)에서 0.2초. 그림자·둥근 모서리 없이 2px 괘선 */
    .h-scrim { position: fixed; inset: 0; z-index: 80; background: rgba(23, 32, 51, .32); }
    .h-drawer {
      position: fixed; inset: 0 0 0 auto; z-index: 81; width: min(460px, 100%); display: flex; flex-direction: column;
      background: var(--platform-bg); border-left: 2px solid var(--platform-ink);
      transform: translateX(100%); visibility: hidden; transition: transform .2s cubic-bezier(.2,0,0,1), visibility 0s .2s;
    }
    .h-drawer.open { transform: none; visibility: visible; transition: transform .2s cubic-bezier(.2,0,0,1); }
    .h-drawer-h { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 2px solid var(--platform-ink); }
    .h-drawer-h h2 { margin: 0; font-size: 18px; font-weight: 800; }
    .h-drawer-b { flex: 1; overflow-y: auto; padding: 20px; display: grid; gap: 16px; align-content: start; }
    .h-field { display: grid; gap: 6px; font-size: 13px; font-weight: 700; }
    .h-field input, .h-field select, .h-field textarea {
      font: inherit; font-size: 14px; font-weight: 400; padding: 9px 12px; min-height: 40px;
      border: 1px solid var(--platform-line-strong); border-radius: 4px; background: #fff;
    }
    .h-field textarea { min-height: 110px; resize: vertical; }
    .h-drawer-f { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--platform-line); }
    .h-err { margin: 0; font-size: 13px; color: var(--platform-blue); }

    /* 되돌리기 알림 */
    .h-toast {
      position: fixed; left: calc(50% + 46px); bottom: 24px; z-index: 90; transform: translate(-50%, 12px); opacity: 0; visibility: hidden;
      display: flex; align-items: center; gap: 18px; min-width: 320px; max-width: calc(100% - 140px); padding: 12px 16px;
      background: #fff; border: 1px solid var(--platform-line-strong); border-top: 2px solid var(--platform-ink); font-size: 14px;
      transition: transform .2s cubic-bezier(.2,0,0,1), opacity .2s cubic-bezier(.2,0,0,1), visibility 0s .2s;
    }
    .h-toast.show { transform: translate(-50%, 0); opacity: 1; visibility: visible; transition: transform .2s cubic-bezier(.2,0,0,1), opacity .2s cubic-bezier(.2,0,0,1); }
    .h-toast button { margin-left: auto; border: 0; background: none; font: inherit; font-weight: 800; color: var(--platform-blue); cursor: pointer; padding: 6px 0; }

    /* 맨 아래 — 내 정보·명함, 자료 현황 */
    .home-profile { margin-top: 48px; }
    .home-profile .profile-card { align-items: center; gap: 14px; padding: 16px 0 0; background: none; border: 0; border-top: 2px solid var(--platform-ink); border-radius: 0; box-shadow: none; }
    .home-profile .profile-photo { width: 46px; height: 46px; font-size: 17px; }
    .home-profile .profile-main { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .home-profile .p-line { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
    .home-profile .p-line .p-name { font-size: 15px; font-weight: 700; }
    .home-profile .p-role { border-radius: 0; background: var(--platform-blue-soft); color: var(--platform-blue-dark); padding: 2px 7px; font-size: 11px; font-weight: 700; }
    .home-profile .p-org { color: var(--platform-muted); font-size: 13px; }
    .home-profile .profile-actions { margin: 0; }
    .home-profile .profile-edit { width: 100%; }
    .home-stats { margin-top: 34px; }
    .home-stats .stat-row { display: flex; flex-wrap: wrap; gap: 20px 56px; margin: 0; padding: 18px 0 0; border: 0; background: none; box-shadow: none; }
    .home-stats .stat-tile { border: 0; padding: 0; background: none; }
    .home-stats .stat-label { display: block; font-size: 11px; font-weight: 700; letter-spacing: 0.06em; color: var(--platform-faint); }
    .home-stats .stat-value { margin-top: 4px; font-size: 28px; font-weight: 800; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
    .home-stats .stat-sub { display: block; margin-top: 5px; font-size: 11.5px; color: var(--platform-muted); }
    .ext-glyph { width: 1em; height: 1em; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; vertical-align: -0.12em; margin-right: 0.42em; opacity: .85; }
    .platform-nav a.nav-ext { display: flex; align-items: center; }

    @media (max-width: 1180px) {
      .platform-main { width: calc(100% - 48px); }
      .h-grid { grid-template-columns: 1fr; gap: 32px; }
      .h-trio { grid-template-columns: 1fr 1fr; }
      .h-trio .h-cell:nth-child(2) { padding-right: 0; }
      .h-trio .h-cell:nth-child(3) { grid-column: 1 / -1; padding-left: 0; border-left: 0; border-top: 1px solid var(--platform-line); }
      .h-toast { left: 50%; }
    }
    @media (max-width: 767px) {
      .platform-main { width: auto; padding: 14px 16px 96px; }
      .global-search { max-width: none; }
      .global-search input { font-size: 16px; }
      .h-mast { flex-direction: column; align-items: stretch; gap: 14px; }
      .h-mast h1 { font-size: 24px; }
      .h-acts .h-btn { flex: 1; min-height: 44px; }
      .h-next { grid-template-columns: 1fr auto; gap: 8px 16px; }
      .h-next .lblbox { grid-column: 1 / -1; display: flex; align-items: baseline; gap: 10px; }
      .h-next .when { margin: 0; font-size: 16px; }
      .h-day { grid-template-columns: 1fr; }
      .h-day-h { padding: 14px 0 2px; display: flex; gap: 10px; align-items: baseline; }
      .h-row { grid-template-columns: 1fr; gap: 8px; padding: 10px 0; }
      .h-btn.sm { min-height: 40px; }
      .h-figs { grid-template-columns: 1fr 1fr; }
      .h-fig:nth-child(3) { border-left: 0; padding-left: 0; }
      .h-fig:nth-child(n+3) { border-top: 1px solid var(--platform-line); }
      .h-fig .v { font-size: 30px; }
      .h-trio { grid-template-columns: 1fr; }
      .h-cell, .h-trio .h-cell:nth-child(3) { padding: 16px 0 8px; border-left: 0; border-top: 1px solid var(--platform-line); }
      .h-cell:first-child { border-top: 0; }
      .h-cell .go { min-height: 44px; }
      .h-drawer { inset: auto 0 0 0; width: 100%; max-height: 92dvh; border-left: 0; border-top: 2px solid var(--platform-ink); transform: translateY(100%); }
      .h-drawer.open { transform: none; }
      .h-drawer-f { padding-bottom: max(14px, env(safe-area-inset-bottom)); }
      .h-drawer-f .h-btn { flex: 1; min-height: 44px; }
      .h-toast { bottom: calc(76px + env(safe-area-inset-bottom)); min-width: 0; width: calc(100% - 32px); max-width: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      .h-drawer, .h-drawer.open, .h-toast, .h-toast.show { transition: none; }
    }
  </style>
</head>

  <div class="platform-shell">
    <header class="platform-topbar" data-region="global-nav">
      <button class="mobile-menu" id="mobile-menu" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span></button>
      <span class="mobile-brand">마이가디언</span>
      <span class="topbar-context">홈</span>
      <span class="topbar-note">신한라이프 FC팀 보험 업무 플랫폼</span>
    </header>

    <main class="platform-main">
      <!-- 통합검색 — 고객(로그인 시)·용어·질병, 엔터는 사례·판례 -->
      <div class="global-search" data-search="global">
        <input type="search" id="global-q" aria-label="통합 검색" placeholder="고객 이름·번호 뒤 4자리, 사례·용어·질병 검색" autocomplete="off">
        <div class="search-suggest" id="suggest" hidden></div>
      </div>

      <!-- 오늘 — 날짜와 오늘의 요약 한 줄 -->
      <section class="h-mast" aria-labelledby="h-date">
        <div>
          <h1 id="h-date"></h1>
          <p class="h-sum" id="h-sum"></p>
        </div>
        <div class="h-acts">
          <a class="h-btn" href="customers/?new=1">고객 등록</a>
          <button class="h-btn primary" type="button" id="h-add-meeting" hidden>미팅 잡기</button>
        </div>
      </section>
      <p class="h-gate" id="h-gate" hidden></p>

      <section class="h-next" id="h-next" aria-label="다음 미팅" hidden></section>

      <div class="h-grid" id="h-grid" hidden>
        <section class="h-sec" aria-labelledby="h-week-t">
          <div class="h-sec-h"><h2 id="h-week-t">오늘과 이번 주</h2><a href="customers/">고객관리</a></div>
          <div id="h-week"></div>
        </section>
        <section class="h-sec" aria-labelledby="h-call-t">
          <div class="h-sec-h"><h2 id="h-call-t">연락할 고객</h2><a href="customers/" id="h-call-all">전체</a></div>
          <div id="h-call"></div>
        </section>
      </div>

      <section class="h-figs" id="h-figs" aria-label="활동" hidden></section>

      <section class="h-trio" id="h-trio" aria-label="발행·요청·브리핑" hidden></section>

      <!-- 내 프로필 — 구 홈 구획 기능 계승 (라운드 6, 사용자 지시). 매거진 판권면 자리: 새소식과 자료 현황 사이.
           명함은 카톡카드·발행에 쓰이는 실무 도구 — 직급·지점 설정이 메인에 있어야 한다 -->
      <section class="section-block home-profile" aria-labelledby="profile-title">
        <div class="section-head">
          <div><h2 id="profile-title">내 정보·명함</h2><p>카톡카드·명함에 들어갑니다.</p></div>
        </div>
        <div class="profile-card" id="profile-card"></div>
        <div class="namecard-stage" aria-hidden="true">
          <div class="namecard" id="namecard"></div>
        </div>
        <input type="file" id="profile-file" accept="image/*" hidden>
      </section>

      <!-- 자료 현황 — 구 홈 구획 verbatim 계승 (라운드 5, 사용자 승인). 칸막이형 격자 = 헌법 지표 타일 문법 -->
      <section class="section-block home-stats" id="home-stats" aria-labelledby="data-status-title">
        <div class="section-head">
          <div><h2 id="data-status-title">자료 현황</h2><p>플랫폼에 입주한 실데이터 규모입니다.</p></div>
        </div>
        <div class="stat-row" id="stat-row">
          <div class="stat-tile"><span class="stat-label">사례·판례</span><div class="stat-value" id="stat-cases">-</div><span class="stat-sub" id="stat-cases-sub"></span></div>
          <div class="stat-tile"><span class="stat-label">보험 용어</span><div class="stat-value" id="stat-terms">-</div><span class="stat-sub">용어 사전</span></div>
          <div class="stat-tile"><span class="stat-label">질병 정보</span><div class="stat-value" id="stat-diseases">-</div><span class="stat-sub">질병 사전</span></div>
        </div>
      </section>
    </main>
    <footer class="platform-footer">마이가디언 v2</footer>
  </div>

  <div class="h-scrim" id="h-scrim" hidden></div>
  <section class="h-drawer" id="h-drawer" role="dialog" aria-modal="true" aria-labelledby="h-drawer-t" inert>
    <div class="h-drawer-h"><h2 id="h-drawer-t"></h2><button class="h-btn sm" type="button" id="h-drawer-close">닫기</button></div>
    <div class="h-drawer-b" id="h-drawer-b"></div>
    <div class="h-drawer-f"><button class="h-btn primary" type="button" id="h-drawer-save">저장</button></div>
  </section>
  <div class="h-toast" id="h-toast" role="status" aria-live="polite"><span id="h-toast-msg"></span><button type="button" id="h-undo">되돌리기</button></div>

  <script>
    // 시작 스플래시 — 세션당 1회, 1.5초 이내 (헌법 모션 예외 조항, 2026-07-20)
    (function () {
      var KEY = "mg_splash_shown";
      if (/[?&]nosplash/.test(location.search)) return; // 렌더 증거용 토글 — 리뷰 렌더에서 스플래시 생략
      try {
        if (sessionStorage.getItem(KEY)) return;
        sessionStorage.setItem(KEY, "1");
      } catch (e) { return; }
      var el = document.getElementById("app-splash");
      el.hidden = false;
      // 안전장치: CSS가 아직/잘못 적용된 상태(구버전 캐시 등)면 스플래시를 띄우지 않는다
      if (getComputedStyle(el).position !== "fixed") { el.hidden = true; return; }
      var still = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
      // 모션 줄이기: 애니메이션 없이 잠깐 정적 표시 후 제거
      setTimeout(function () { el.hidden = true; }, still ? 700 : 1350);
    })();

    // 바로가기 설치 진입점 — 설치 절차는 전용 화면(install.html)이 전담한다 (개정 10차)
    (function () {
      if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
        navigator.serviceWorker.register("sw.js").catch(function () {});
      }
      var installBtn = document.getElementById("btn-install");
      var isStandalone = window.matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
      // 이미 앱으로 실행 중이면 숨기고, 브라우저로 보고 있으면 항상 안내한다
      installBtn.hidden = isStandalone;
      window.addEventListener("appinstalled", function () { installBtn.hidden = true; });
    })();

    // ══ 오늘 (2026-10-04) ═══════════════════════════════════════════════════
    // 실데이터만: 서버 고객(미팅·진행상태·다음 연락일), 발행 목록, 수정 요청, 브리핑 자료.
    // 한 칸의 데이터를 못 받으면 그 칸만 만들지 않는다(헌법 — 가짜 수치·빈 상자 금지).
    // 「완료」「내일로」「미팅 잡기」「기록」은 고객관리와 같은 방식으로 레코드 전체를 PUT /clients 로 저장하고,
    // 미팅은 하랑지점 달력에도 보낸다(customers/index.html branchPush 와 같은 모양·같은 대기열 mg_event_queue).
    window.mgHome = (function () {
      "use strict";
      var esc = window.mg.esc;
      var $ = function (id) { return document.getElementById(id); };
      var DAYS = "일월화수목금토";
      var now = new Date();
      function ymd(d) { return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
      var TODAY = ymd(now);
      function addDays(iso, n) { var d = new Date(iso + "T00:00:00"); d.setDate(d.getDate() + n); return ymd(d); }
      function diff(iso) { return Math.round((new Date(String(iso).slice(0, 10) + "T00:00:00") - new Date(TODAY + "T00:00:00")) / 864e5); }
      function md(iso) { var d = new Date(String(iso).slice(0, 10) + "T00:00:00"); return (d.getMonth() + 1) + "." + d.getDate() + " " + DAYS.charAt(d.getDay()); }

      $("h-date").textContent = (now.getMonth() + 1) + "월 " + now.getDate() + "일 " + DAYS.charAt(now.getDay()) + "요일";

      var CLIENTS = [];
      function v1(c) { return (c.profile && c.profile["v1원본"]) || c.profile || {}; }
      function nameOf(c) { return String(v1(c).customerName || c["고객코드"]).trim(); }
      function meetings(c) { return (c.profile && c.profile["미팅"]) || []; }
      function custHref(c) { return "customers/?code=" + encodeURIComponent(c["고객코드"]); }
      function maskPhone(p) { var d = String(p || "").replace(/\D/g, ""); return d.length < 8 ? "" : d.slice(0, 3) + "-****-" + d.slice(-4); }

      // ── 저장 — 레코드 전체를 보낸다(서버가 통째로 바꾼다). 실패하면 화면을 되돌린다
      function save(c) {
        var rec = { "고객코드": c["고객코드"], profile: c.profile, policies: c.policies, memoText: c.memoText };
        return window.mgAuth.api("/clients", { method: "PUT", body: [rec] });
      }
      var BRANCH_API = /^(localhost|127\.0\.0\.1)$/.test(location.hostname) ? "http://localhost:8788" : "https://api.insurguard.life/branch";
      function branchPush(c, round, date, status) {
        var key = "mg:" + c["고객코드"] + ":" + round, q;
        try { q = JSON.parse(localStorage.getItem("mg_event_queue") || "{}"); } catch (e) { q = {}; }
        q[key] = { "출처": "myguardian", "출처키": key, "종류": "고객미팅", "고객코드": c["고객코드"],
          "표시명": nameOf(c), "연락처": maskPhone(v1(c).phone), "차수": round, "일시": date, "상태": status };
        try { localStorage.setItem("mg_event_queue", JSON.stringify(q)); } catch (e) {}
        var token = window.mgAuth.token();
        Object.keys(q).forEach(function (k) {
          fetch(BRANCH_API + "/events/upsert", { method: "POST",
            headers: { "Content-Type": "application/json", "Authorization": "Bearer " + token }, body: JSON.stringify(q[k]) })
            .then(function (r) {
              if (!r.ok) return;
              var cur; try { cur = JSON.parse(localStorage.getItem("mg_event_queue") || "{}"); } catch (e) { return; }
              delete cur[k];
              try { localStorage.setItem("mg_event_queue", JSON.stringify(cur)); } catch (e) {}
            }).catch(function () {});
        });
      }

      // ── 되돌리기 알림 — 여러 번 누르면 거꾸로 하나씩 되돌린다. 마우스를 올리면 시계가 멈춘다
      var undoStack = [], toastTimer = null;
      function toast(text, undo) {
        var t = $("h-toast");
        $("h-toast-msg").textContent = text;
        if (undo) undoStack.push(undo);
        $("h-undo").hidden = !undoStack.length;
        t.classList.add("show");
        clearTimeout(toastTimer); toastTimer = setTimeout(hideToast, 7000);
      }
      function hideToast() { $("h-toast").classList.remove("show"); undoStack = []; }

      // ── 미팅 바꾸기(완료·미루기·추가) — 화면 먼저, 서버 뒤. 실패하면 되돌리고 알린다
      function mutate(c, apply, revert, msg, push) {
        apply();
        render();
        return save(c).then(function () {
          push && push();
          toast(msg, function () {
            revert(); render();
            save(c).then(function () { push && push(true); }).catch(function (e) { toast("되돌리지 못했습니다 — " + e.message); });
          });
        }).catch(function (e) {
          revert(); render();
          toast(e.status === 401 ? "로그인이 풀렸습니다. 다시 로그인해 주세요." : "저장하지 못했습니다 — " + e.message);
        });
      }
      function done(c, i) {
        var m = meetings(c)[i], prev = { st: m["상태"], cs: c.profile["진행상태"] };
        mutate(c, function () { m["상태"] = "완료"; c.profile["진행상태"] = "미팅 완료"; },
          function () { m["상태"] = prev.st; c.profile["진행상태"] = prev.cs; },
          nameOf(c) + " 님 " + m["차수"] + "차 미팅을 완료로 바꿨습니다.",
          function (back) { branchPush(c, m["차수"], m["일자"], back ? prev.st : "완료"); });
      }
      function later(c, i) {
        var m = meetings(c)[i], prev = m["일자"], next = addDays(m["일자"] < TODAY ? TODAY : m["일자"], 1);
        mutate(c, function () { m["일자"] = next; }, function () { m["일자"] = prev; },
          nameOf(c) + " 님 미팅을 " + md(next) + "요일로 옮겼습니다.",
          function (back) { branchPush(c, m["차수"], back ? prev : next, "예정"); });
      }

      // ── 그리기
      function upcoming() {
        var out = [];
        CLIENTS.forEach(function (c) {
          meetings(c).forEach(function (m, i) {
            if (!m || m["상태"] !== "예정" || !m["일자"]) return;
            var n = diff(m["일자"]);
            if (n <= 6) out.push({ c: c, i: i, m: m, n: n });
          });
        });
        return out.sort(function (a, b) { return a.m["일자"] < b.m["일자"] ? -1 : a.m["일자"] > b.m["일자"] ? 1 : nameOf(a.c) < nameOf(b.c) ? -1 : 1; });
      }
      function lastDone(c) {
        var best = null;
        meetings(c).forEach(function (m) { if (m && m["상태"] === "완료" && m["일자"] && (!best || m["일자"] > best)) best = m["일자"]; });
        return best;
      }
      function contacts() {
        var seen = {}, out = [];
        function add(c, kind, text) { if (seen[c["고객코드"]]) return; seen[c["고객코드"]] = 1; out.push({ c: c, kind: kind, text: text }); }
        CLIENTS.forEach(function (c) {
          if (c.profile && c.profile["진행상태"] === "다시 전화") {
            var nc = v1(c).nextContactDate;
            add(c, "다시 전화", nc ? "다음 연락 " + md(nc) : "다시 연락하기로 함");
          }
        });
        CLIENTS.forEach(function (c) {
          var nc = v1(c).nextContactDate;
          if (nc && diff(nc) <= 0) add(c, "연락일", (diff(nc) === 0 ? "오늘" : -diff(nc) + "일 지남") + " · " + md(nc));
        });
        CLIENTS.forEach(function (c) {
          var st = c.profile && c.profile["진행상태"];
          if (st === "거절" || st === "보류") return;
          var ld = lastDone(c);
          if (!ld) return;
          var ago = -diff(ld);
          var future = meetings(c).some(function (m) { return m && m["상태"] === "예정"; });
          if (ago >= 3 && ago <= 14 && !future) add(c, "후속 연락", "미팅 끝난 지 " + ago + "일");
        });
        return out;
      }

      function rowHtml(x, kindLabel) {
        var c = x.c, m = x.m, label = x.n <= 0 ? "내일로" : "하루 미루기";
        var rec = ((c.profile && c.profile["기록"]) || []).filter(function (r) { return r && !r["무효"]; })[0];
        var memo = rec ? rec["내용"] : String(c.memoText || "").split("\n").map(function (l) { return l.replace(/^#+\s*/, "").trim(); })
          .filter(function (l) { return l && !/^상담 메모/.test(l); })[0] || "";
        return '<div class="h-row" data-code="' + esc(c["고객코드"]) + '" data-i="' + x.i + '">'
          + '<div class="h-who"><a href="' + custHref(c) + '">' + esc(nameOf(c)) + "</a>"
          + '<span class="k">' + esc((m["차수"] || "") + "차 미팅") + (kindLabel ? " · " + esc(kindLabel) : "") + "</span>"
          + (memo ? '<span class="d">' + esc(memo) + "</span>" : "") + "</div>"
          + '<div class="h-do"><button class="h-btn sm" type="button" data-act="done">완료</button>'
          + '<button class="h-btn sm" type="button" data-act="later">' + label + "</button></div></div>";
      }

      function render() {
        var up = upcoming();
        var late = up.filter(function (x) { return x.n < 0; });
        var today = up.filter(function (x) { return x.n === 0; });
        var tmr = up.filter(function (x) { return x.n === 1; });
        var week = up.filter(function (x) { return x.n > 1; });
        var calls = contacts();

        // 요약 한 줄
        var sum = ['<span>오늘 미팅 <b class="num">' + today.length + "건</b></span>",
          '<span>연락할 고객 <b class="num">' + calls.length + "명</b></span>"];
        if (late.length) sum.push('<span>정리 안 한 미팅 <b class="num due">' + late.length + "건</b></span>");
        if (window.mgHomeCare) sum.push(window.mgHomeCare);
        $("h-sum").innerHTML = sum.join("");

        // 다음 미팅
        var nx = today[0] || tmr[0] || week[0];
        var next = $("h-next");
        if (nx) {
          var when = nx.n === 0 ? "오늘" : nx.n === 1 ? "내일" : nx.n + "일 뒤";
          next.innerHTML = '<div class="lblbox"><div class="lbl">다음 미팅</div><div class="when' + (nx.n === 0 ? " today" : "") + '">' + when + "</div></div>"
            + "<div><h2>" + esc(nameOf(nx.c)) + "<span>" + esc(nx.m["차수"] + "차 미팅 · " + md(nx.m["일자"])) + "</span></h2>"
            + (v1(nx.c).category ? "<p>" + esc({ referral: "지인", transfer: "이관", valueup: "밸류업", contract: "계약" }[v1(nx.c).category] || v1(nx.c).category)
              + (nx.c.policies && nx.c.policies.policies && nx.c.policies.policies.length ? " · 보유보험 " + nx.c.policies.policies.length + "건" : "") + "</p>" : "")
            + '</div><a class="h-btn" href="' + custHref(nx.c) + '">고객 열기</a>';
          next.hidden = false;
        } else next.hidden = true;

        // 오늘과 이번 주
        function day(cls, title, sub, list) {
          if (!list.length) return "";
          return '<div class="h-day"><div class="h-day-h ' + cls + '"><b>' + title + '</b><span class="num">' + sub + '</span></div><div class="rows">'
            + list.map(function (x) { return rowHtml(x, cls === "late" ? md(x.m["일자"]) : x.n > 1 ? md(x.m["일자"]) : ""); }).join("") + "</div></div>";
        }
        var weekHtml = day("late", "정리 안 함", "지난 날짜", late)
          + day("today", "오늘", md(TODAY), today) + day("", "내일", md(addDays(TODAY, 1)), tmr)
          + day("", "이번 주", md(addDays(TODAY, 6)) + "까지", week);
        $("h-week").innerHTML = weekHtml || '<p class="h-empty">이번 주 잡힌 미팅이 없습니다. 고객을 열어 다음 미팅을 잡으세요.</p>';

        // 연락할 고객
        $("h-call").innerHTML = calls.length ? calls.slice(0, 6).map(function (x) {
          var p = String(v1(x.c).phone || "").replace(/[^\d+]/g, "");
          return '<div class="h-contact" data-code="' + esc(x.c["고객코드"]) + '"><div><a class="n" href="' + custHref(x.c) + '">' + esc(nameOf(x.c)) + "</a>"
            + '<span class="why"><b>' + esc(x.kind) + "</b> — " + esc(x.text) + "</span></div>"
            + '<div class="h-do">' + (p ? '<a class="h-btn sm" href="tel:' + esc(p) + '">전화</a>' : "")
            + '<button class="h-btn sm" type="button" data-act="note">기록</button></div></div>';
        }).join("") : '<p class="h-empty">지금 연락할 고객이 없습니다.</p>';
        $("h-call-all").textContent = calls.length > 6 ? "전체 " + calls.length + "명" : "고객관리";

        // 활동 수치 — 금액이 아니라 활동
        var active = CLIENTS.filter(function (c) { var s = c.profile && c.profile["진행상태"]; return s === "미팅 예정" || s === "미팅 완료"; }).length;
        var recall = CLIENTS.filter(function (c) { return c.profile && c.profile["진행상태"] === "다시 전화"; }).length;
        $("h-figs").innerHTML =
          fig("이번 주 미팅", up.filter(function (x) { return x.n >= 0; }).length, "건", "오늘부터 7일")
          + fig("다시 전화", recall, "명", "진행상태 기준")
          + fig("진행 중 고객", active, "명", "미팅 예정·완료")
          + fig("전체 고객", CLIENTS.length, "명", "서버 고객");
        $("h-figs").hidden = false;
      }
      function fig(k, v, unit, d) {
        return '<div class="h-fig"><div class="k">' + k + '</div><div class="v num">' + v + "<small>" + unit + '</small></div><div class="d">' + d + "</div></div>";
      }

      // ── 서랍 — 미팅 잡기·연락 기록
      var drawerSave = null, lastFocus = null;
      function openDrawer(title, body, onSave) {
        lastFocus = document.activeElement;
        $("h-drawer-t").textContent = title;
        $("h-drawer-b").innerHTML = body;
        drawerSave = onSave;
        $("h-scrim").hidden = false;
        $("h-drawer").classList.add("open");
        $("h-drawer").removeAttribute("inert");
        var f = $("h-drawer-b").querySelector("input,select,textarea"); if (f) f.focus();
      }
      function closeDrawer() {
        $("h-drawer").classList.remove("open");
        $("h-drawer").setAttribute("inert", "");
        $("h-scrim").hidden = true; drawerSave = null;
        if (lastFocus && lastFocus.focus) lastFocus.focus();
      }
      function meetingDrawer(preset) {
        var opts = CLIENTS.slice().sort(function (a, b) { return nameOf(a) < nameOf(b) ? -1 : 1; }).map(function (c) {
          return '<option value="' + esc(c["고객코드"]) + '"' + (preset === c["고객코드"] ? " selected" : "") + ">" + esc(nameOf(c) + " · " + c["고객코드"]) + "</option>";
        }).join("");
        openDrawer("미팅 잡기",
          '<label class="h-field">고객<select id="hd-cust">' + opts + "</select></label>"
          + '<label class="h-field">날짜<input type="date" id="hd-date" value="' + TODAY + '" min="' + TODAY + '"></label>'
          + '<p class="h-err" id="hd-err" hidden></p>',
          function () {
            var c = CLIENTS.find(function (x) { return x["고객코드"] === $("hd-cust").value; });
            var date = $("hd-date").value;
            if (!c || !date) { $("hd-err").hidden = false; $("hd-err").textContent = "고객과 날짜를 골라 주세요."; return; }
            if (!c.profile["미팅"]) c.profile["미팅"] = [];
            var list = c.profile["미팅"], round = list.reduce(function (n, m) { return Math.max(n, Number(m && m["차수"]) || 0); }, 0) + 1;
            var prevSt = c.profile["진행상태"];
            closeDrawer();
            mutate(c, function () { list.push({ "차수": round, "일자": date, "상태": "예정" }); c.profile["진행상태"] = "미팅 예정"; },
              function () { list.pop(); c.profile["진행상태"] = prevSt; },
              nameOf(c) + " 님 " + round + "차 미팅을 " + md(date) + "요일로 잡았습니다.",
              function (back) { branchPush(c, round, date, back ? "취소" : "예정"); });
          });
      }
      function noteDrawer(c) {
        openDrawer(nameOf(c) + " 님 연락 기록",
          '<label class="h-field">무슨 이야기를 했나요<textarea id="hd-note" placeholder="예: 통화 — 다음 주 수요일 저녁 가능, 자녀 보험 비교안 요청"></textarea></label>'
          + '<label class="h-field">진행상태<select id="hd-st"><option value="">그대로 (' + esc(c.profile["진행상태"] || "미분류") + ')</option>'
          + ["다시 전화", "미팅 예정", "보류", "거절"].map(function (s) { return "<option>" + s + "</option>"; }).join("") + "</select></label>"
          + '<p class="h-err" id="hd-err" hidden></p>',
          function () {
            var note = $("hd-note").value.trim(), st = $("hd-st").value;
            if (!note && !st) { $("hd-err").hidden = false; $("hd-err").textContent = "기록이나 진행상태 중 하나는 적어 주세요."; return; }
            // 고객관리의 쌓이는 기록(profile.기록)과 같은 칸에 넣는다 — 메모 한 칸은 이전 메모로만 남는다
            var prevRec = c.profile["기록"], prevSt = c.profile["진행상태"];
            closeDrawer();
            mutate(c, function () {
              if (note) c.profile["기록"] = [{ "일자": TODAY, "방법": "전화", "내용": note }].concat(prevRec || []);
              if (st) c.profile["진행상태"] = st;
            }, function () { if (prevRec) c.profile["기록"] = prevRec; else delete c.profile["기록"]; c.profile["진행상태"] = prevSt; },
            nameOf(c) + " 님 연락 기록을 남겼습니다.");
          });
      }

      // ── 이벤트
      document.addEventListener("click", function (e) {
        var b = e.target.closest("[data-act]");
        if (b) {
          var holder = b.closest("[data-code]");
          var c = holder && CLIENTS.find(function (x) { return x["고객코드"] === holder.dataset.code; });
          if (!c) return;
          if (b.dataset.act === "done") done(c, Number(holder.dataset.i));
          else if (b.dataset.act === "later") later(c, Number(holder.dataset.i));
          else if (b.dataset.act === "note") noteDrawer(c);
          return;
        }
      });
      $("h-add-meeting").addEventListener("click", function () { meetingDrawer(); });
      $("h-drawer-save").addEventListener("click", function () { if (drawerSave) drawerSave(); });
      $("h-drawer-close").addEventListener("click", closeDrawer);
      $("h-scrim").addEventListener("click", closeDrawer);
      document.addEventListener("keydown", function (e) { if (e.key === "Escape" && $("h-drawer").classList.contains("open")) closeDrawer(); });
      $("h-undo").addEventListener("click", function () { var u = undoStack.pop(); if (u) u(); if (!undoStack.length) hideToast(); });
      $("h-toast").addEventListener("mouseenter", function () { clearTimeout(toastTimer); });
      $("h-toast").addEventListener("mouseleave", function () { toastTimer = setTimeout(hideToast, 3000); });

      // ── 세 칸 — 발행·요청·브리핑(각자 받아 오고, 못 받으면 그 칸만 뺀다)
      function trio(api) {
        var cells = [];
        var nextMon = (8 - now.getDay()) % 7; // 주간 발행은 월요일
        var care = (api.issues || []).filter(function (i) { return i && i["채널"] === "주간"; })
          .sort(function (a, b) { return (Number(b["호수"]) || 0) - (Number(a["호수"]) || 0); });
        if (api.issues) {
          var no = (Number(care[0] && care[0]["호수"]) || 0) + 1;
          var draft = null; try { draft = JSON.parse(localStorage.getItem("mg_care_draft_weekly-" + no) || "null"); } catch (e) {}
          var arts = draft && Array.isArray(draft["기사"]) ? draft["기사"] : [];
          var written = arts.filter(function (a) { return (a["본문"] || []).length; }).length;
          var dueTxt = nextMon === 0 ? "오늘" : nextMon === 1 ? "내일" : "D-" + nextMon;
          window.mgHomeCare = '<span>주간 ' + no + '호 발행 <b class="due">' + dueTxt + "</b></span>";
          cells.push('<div class="h-cell"><div class="eb">케어센터</div><h3>주간 ' + no + "호</h3>"
            + '<p>발행 <span class="due">' + dueTxt + "</span>" + (arts.length ? " · 칼럼 " + arts.length + "개 중 " + written + "개 작성" : " · 아직 초안 없음") + "</p>"
            + (arts.length ? '<div class="h-bar" aria-hidden="true"><i style="width:' + Math.round(written / arts.length * 100) + '%"></i></div>' : "")
            + (care[0] ? '<ul><li><a href="care/issue.html?id=' + encodeURIComponent(care[0].id) + '">' + esc(care[0]["제목"] || "") + '</a><span class="num">' + esc(String(care[0]["호수"])) + "호</span></li></ul>" : "")
            + '<a class="go" href="care/desk.html">발행 데스크</a></div>');
        }
        if (api.requests) {
          var mine = api.requests.filter(function (r) { return r.mine; });
          var list = (mine.length ? mine : api.requests).slice(0, 2);
          var answered = mine.filter(function (r) { return r.answer; }).length;
          cells.push('<div class="h-cell"><div class="eb">수정 요청</div><h3>' + (mine.length ? "내 요청 " + mine.length + "건" : "요청 " + api.requests.length + "건") + "</h3>"
            + (mine.length ? "<p>답변 " + answered + "건</p>" : "")
            + (list.length ? "<ul>" + list.map(function (r) { return '<li><a href="requests/">' + esc(r.title) + "</a><span>" + esc(r.status) + "</span></li>"; }).join("") + "</ul>" : "")
            + '<a class="go" href="requests/">요청 게시판</a></div>');
        }
        if (api.library && api.library.length) {
          var lib = api.library.slice().sort(function (a, b) { return String(b["등록일"] || "") < String(a["등록일"] || "") ? -1 : 1; }).slice(0, 2);
          cells.push('<div class="h-cell"><div class="eb">브리핑</div><h3>최근 자료</h3><ul>'
            + lib.map(function (d) { return '<li><a href="brief/present.html?doc=' + encodeURIComponent(d.id) + '">' + esc(d["제목"] || "") + '</a><span class="num">'
              + esc(String(d["등록일"] || "").slice(5, 10).replace("-", ".")) + "</span></li>"; }).join("")
            + '</ul><a class="go" href="brief/">브리핑</a></div>');
        }
        if (cells.length) { $("h-trio").innerHTML = cells.join(""); $("h-trio").style.setProperty("--cells", cells.length); $("h-trio").hidden = false; }
      }

      function start() {
        if (!window.mgAuth || !window.mgAuth.token()) {
          $("h-gate").innerHTML = '로그인하면 오늘 미팅과 연락할 고객이 여기 보입니다. <a href="intro.html">로그인</a>';
          $("h-gate").hidden = false;
          return;
        }
        var api = window.mgAuth.api;
        var soft = function (p) { return p.then(function (v) { return v; }, function () { return null; }); };
        Promise.all([api("/clients"), soft(api("/care/issues")), soft(api("/requests")), soft(api("/brief/library"))])
          .then(function (r) {
            CLIENTS = (r[0] && r[0]["고객"]) || [];
            trio({ issues: r[1], requests: r[2], library: r[3] });
            $("h-grid").hidden = false;
            $("h-add-meeting").hidden = !CLIENTS.length;
            render();
          })
          .catch(function (e) {
            $("h-gate").textContent = e && e.status === 401 ? "로그인이 풀렸습니다. 다시 로그인하면 오늘 일정이 보입니다." : "오늘 일정을 불러오지 못했습니다 — " + (e && e.message || "");
            $("h-gate").hidden = false;
          });
      }
      start();
      return { clients: function () { return CLIENTS; } };
    })();

    // 내 프로필·자동 명함 — 구 홈 구현 계승 (라운드 6): 기기 프로필(localStorage mg_profile) 로딩,
    // 인라인 수정 폼, 사진 첨부(512px 축소), 명함 이미지 저장(html2canvas), 카톡 서명(mg_care_sender) 동기화.
    // /me 이름과 기기 프로필이 달라도 기기 프로필 우선 — 명함은 본인이 설정한 표기가 맞다 (구 동작 그대로, /me 미참조).
    (function () {
      "use strict";
      var esc = window.mg.esc;
      var KEY = "mg_profile";
      var 계정이름 = "";   // /me가 오면 채운다 — 저장된 프로필이 없을 때의 기본 이름
      var FIELDS = [
        { k: "이름", label: "이름", ph: "예: 안창민" },
        { k: "직함", label: "직함", ph: "예: FC / 팀장" },
        { k: "지점", label: "소속 지점", ph: "예: 신한라이프 하랑지점" },
        { k: "연락처", label: "연락처", ph: "예: 010-0000-0000" },
        { k: "전문분야", label: "전문분야", ph: "예: 보장분석 · 상속 · 절세" }
      ];

      // 사진 값은 우리가 만든 JPEG data URL 형식만 허용 — 저장소가 오염돼도 속성 주입이 불가능하다
      function validPhoto(v) {
        return (typeof v === "string" && /^data:image\/(jpeg|png);base64,[A-Za-z0-9+/=]+$/.test(v) && v.length < 1200000) ? v : "";
      }

      function load() {
        try {
          var p = JSON.parse(localStorage.getItem(KEY));
          if (p && typeof p === "object") {   // 이름이 빈 저장본도 버리지 않는다(사진 등을 지킨다)
            p["사진"] = validPhoto(p["사진"]);
            return p;
          }
        } catch (e) {}
        // 저장된 프로필이 없으면 로그인 계정 이름 → 카톡 서명 순으로 잇는다. 둘 다 없으면 비워 둔다
        var name = 계정이름, org = "신한라이프 하랑지점";
        try {
          var s = JSON.parse(localStorage.getItem("mg_care_sender"));
          if (s && s["이름"]) { if (!name) name = s["이름"].replace(/\s*FC$/, ""); org = s["소속"] || org; }
        } catch (e) {}
        return { "이름": name, "직함": "FC", "지점": org, "연락처": "", "전문분야": "", "사진": "" };
      }

      var saveNote = "";
      function save(p) {
        saveNote = "";
        try {
          localStorage.setItem(KEY, JSON.stringify(p));
        } catch (e) {
          // 저장 공간 초과 — 사진을 버리고 텍스트만이라도 지킨다
          p["사진"] = "";
          saveNote = "저장 공간이 부족해 사진을 뺐습니다. 더 작은 사진으로 다시 첨부하세요.";
          try { localStorage.setItem(KEY, JSON.stringify(p)); } catch (e2) {}
        }
        // 케어센터 카톡 서명과 한 몸으로 움직인다 — 이름이 비었으면 「 FC」만 남은 서명을 쓰지 않는다
        if (p["이름"]) localStorage.setItem("mg_care_sender", JSON.stringify({
          "이름": p["이름"] + (p["직함"] ? " " + p["직함"] : ""),
          "소속": p["지점"]
        }));
      }

      var box = document.getElementById("profile-card");
      var fileInput = document.getElementById("profile-file");
      var profile = load();

      function photoHtml(p) {
        var photo = validPhoto(p["사진"]);
        return photo
          ? '<img class="profile-photo" id="p-photo" src="' + photo + '" alt="프로필 사진">'
          : '<div class="profile-photo placeholder" id="p-photo">' + esc((p["이름"] || "?").charAt(0)) + "</div>";
      }

      // 뷰 = 가로 컴팩트 스트립 (라운드 6 형태 변형): 아바타 + 이름·직급 배지·지점 한 줄 + 우측 아웃라인 버튼 2개.
      // 필 primary는 화면당 1개(케어센터 열기) — 구 카드의 .primary 필 버튼은 아웃라인 급으로 강등
      function renderView() {
        var p = profile;
        box.innerHTML = photoHtml(p)
          + '<div class="profile-main">'
          + '<div class="p-line"><span class="p-name">' + esc(p["이름"]) + "</span>"
          + (p["직함"] ? '<span class="p-role">' + esc(p["직함"]) + "</span>" : "")
          + (p["지점"] ? '<span class="p-org">' + esc(p["지점"]) + "</span>" : "")
          + "</div>"
          + '<div class="profile-actions">'
          + '<button type="button" id="p-edit">프로필 수정</button>'
          + '<button type="button" id="p-card">명함 이미지 저장</button>'
          + "</div>"
          + (saveNote ? '<p style="margin:8px 0 0;font-size:12px;color:#b45309">' + esc(saveNote) + "</p>" : "")
          + "</div>";
        document.getElementById("p-edit").addEventListener("click", renderEdit);
        document.getElementById("p-card").addEventListener("click", downloadCard);
      }

      function renderEdit() {
        var p = profile;
        box.innerHTML = photoHtml(p)
          + '<div class="profile-main"><div class="profile-edit">'
          + FIELDS.map(function (f) {
              var span = f.k === "전문분야" ? " class=\"span2\"" : "";
              return "<label" + span + ">" + f.label
                + '<input type="text" data-k="' + f.k + '" value="' + esc(p[f.k] || "") + '" placeholder="' + f.ph + '">'
                + "</label>";
            }).join("")
          + "</div>"
          + '<div class="profile-actions">'
          + '<button type="button" id="p-photo-btn">사진 첨부</button>'
          + '<button type="button" id="p-save">저장</button>'
          + '<button type="button" id="p-cancel">취소</button>'
          + "</div></div>";
        document.getElementById("p-photo-btn").addEventListener("click", function () { fileInput.click(); });
        document.getElementById("p-cancel").addEventListener("click", renderView);
        document.getElementById("p-save").addEventListener("click", function () {
          box.querySelectorAll("input[data-k]").forEach(function (inp) {
            profile[inp.dataset.k] = inp.value.trim();
          });
          if (!profile["이름"]) profile["이름"] = 계정이름;
          save(profile);
          renderView();
        });
      }

      // 사진은 512px로 축소해 이 브라우저에만 저장한다 (외부 전송 없음)
      fileInput.addEventListener("change", function () {
        var f = fileInput.files && fileInput.files[0];
        if (!f) return;
        var img = new Image();
        img.onload = function () {
          var side = Math.min(img.width, img.height);
          var canvas = document.createElement("canvas");
          canvas.width = canvas.height = 512;
          var ctx = canvas.getContext("2d");
          ctx.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, 512, 512);
          profile["사진"] = canvas.toDataURL("image/jpeg", 0.85);
          save(profile);
          var mark = document.getElementById("p-photo");
          if (mark) mark.outerHTML = photoHtml(profile);
          URL.revokeObjectURL(img.src);
        };
        img.src = URL.createObjectURL(f);
        fileInput.value = "";
      });

      // 명함 자동 생성 — 골드 프레임 배경에 저장된 프로필로 조판
      function downloadCard() {
        var btn = document.getElementById("p-card");
        btn.disabled = true;
        btn.textContent = "생성 중";
        var p = profile;
        var card = document.getElementById("namecard");
        var rows = [["연락처", p["연락처"]], ["지점", p["지점"]], ["전문분야", p["전문분야"]]]
          .filter(function (r) { return r[1]; })
          .map(function (r) {
            return "<div><span class=\"k\">" + r[0] + "</span>" + esc(r[1]) + "</div>";
          }).join("");
        card.innerHTML = '<span class="n-kicker">신한라이프</span>'
          + '<div class="n-name">' + esc(p["이름"]) + (p["직함"] ? "<small>" + esc(p["직함"]) + "</small>" : "") + "</div>"
          + '<div class="n-rule"></div>'
          + '<div class="n-rows">' + rows + "</div>"
          + (validPhoto(p["사진"]) ? '<img class="n-photo" src="' + validPhoto(p["사진"]) + '" alt="">' : "");
        ensureH2C().then(function () {
          return html2canvas(card, { scale: 2, useCORS: true, backgroundColor: null });
        }).then(function (canvas) {
          var a = document.createElement("a");
          a.download = "명함-" + p["이름"] + ".png";
          a.href = canvas.toDataURL("image/png");
          a.click();
          btn.disabled = false;
          btn.textContent = "명함 이미지 저장";
        }).catch(function () {
          btn.disabled = false;
          btn.textContent = "생성 실패 - 다시 시도";
        });
      }

      var h2cPromise = null;
      function ensureH2C() {
        if (window.html2canvas) return Promise.resolve();
        if (!h2cPromise) {
          h2cPromise = new Promise(function (resolve, reject) {
            var s = document.createElement("script");
            s.src = "https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js";
            s.onload = resolve;
            s.onerror = function () { h2cPromise = null; reject(); };
            document.head.appendChild(s);
          });
        }
        return h2cPromise;
      }

      renderView();

      // 이름이 빈 프로필은 로그인 계정 이름으로 채운다(저장된 이름이 있으면 그것이 우선)
      if (window.mgAuth) window.mgAuth.me().then(function (info) {
        var n = info && info["계정"] && info["계정"]["이름"];
        if (!n) return;
        계정이름 = n;
        if (!profile["이름"]) {
          profile["이름"] = n;
          if (document.getElementById("p-edit")) renderView();   // 편집 중이면 입력을 덮지 않는다
        }
      }).catch(function () {});
    })();

    // 자료 현황 — 구 홈 구현 계승: data/stats.json 실데이터 집계만 표시.
    // 수치는 실제 값을 즉시 표시한다 — 중간값을 지어내는 카운트업은 가짜 수치 금지 원칙 위반 (Codex 4차, 구 홈 주석 계승)
    (function () {
      fetch("../data/stats.json")
        .then(function (r) { return r.json(); })
        .then(function (s) {
          var cells = [["사례", "stat-cases"], ["용어", "stat-terms"], ["질병", "stat-diseases"]];
          var alive = 0;
          cells.forEach(function (c) {
            var el = document.getElementById(c[1]);
            if (s[c[0]] > 0) { el.textContent = s[c[0]].toLocaleString(); alive++; }
            else el.closest(".stat-tile").remove(); // 0건 셀은 그 셀만 생략
          });
          if (!alive) { document.getElementById("home-stats").remove(); return; } // 전 셀 0건이면 구획 생략
          var by = s["사례_출처별"] || {};
          var sub = document.getElementById("stat-cases-sub");
          if (sub) sub.textContent = Object.keys(by).slice(0, 3).map(function (k) { return k + " " + by[k]; }).join(" · ");
        })
        .catch(function () {
          document.getElementById("stat-row").innerHTML =
            '<div class="stat-tile"><span class="stat-label">자료 현황</span><span class="stat-sub">데이터를 불러오지 못했습니다.</span></div>';
        });
    })();

    // 통합검색 — 용어·질병 즉석 제안, 사례는 사례 화면으로. 사전은 첫 입력 시에만 로드.
    (function () {
      "use strict";
      var input = document.getElementById("global-q");
      var panel = document.getElementById("suggest");
      var TERMS = null, DISEASES = null, dictsPromise = null, dictsFailed = false;

      var esc = window.mg.esc;

      function loadDicts() {
        // 진행 중인 로드를 공유해 로딩 경합 시 빈 결과 오표시를 막는다
        if (!dictsPromise) {
          dictsPromise = Promise.all([
            fetch("../data/dictionary/terms.json").then(function (r) { return r.json(); }),
            fetch("../data/dictionary/diseases.json").then(function (r) { return r.json(); })
          ]).then(function (res) {
            TERMS = res[0].data || [];
            DISEASES = res[1].data || [];
          }).catch(function () {
            TERMS = []; DISEASES = []; dictsFailed = true;
          });
        }
        return dictsPromise;
      }

      function suggest() {
        var q = input.value.trim();
        if (q.length < 1) { panel.hidden = true; return; }
        var terms = (TERMS || []).filter(function (t) {
          return (t.termName || "").indexOf(q) >= 0;
        }).slice(0, 5);
        var diseases = (DISEASES || []).filter(function (d) {
          return (d.name || "").indexOf(q) >= 0 || (d.searchTags || "").indexOf(q) >= 0;
        }).slice(0, 5);
        var html = [];
        var custs = [];
        if (window.mgHome) {
          var digits = q.replace(/\D/g, "");
          custs = window.mgHome.clients().filter(function (c) {
            var o = (c.profile && c.profile["v1원본"]) || c.profile || {};
            var ph = String(o.phone || "").replace(/\D/g, "");
            return String(o.customerName || "").indexOf(q) >= 0 || String(c["고객코드"]).indexOf(q) >= 0
              || (digits.length >= 4 && ph.slice(-4) === digits.slice(-4));
          }).slice(0, 5);
        }
        if (custs.length) {
          html.push('<p class="suggest-label">내 고객</p>');
          custs.forEach(function (c) {
            var o = (c.profile && c.profile["v1원본"]) || c.profile || {};
            html.push('<a class="suggest-item" href="customers/?code=' + encodeURIComponent(c["고객코드"]) + '">'
              + '<span class="t">' + esc(o.customerName || c["고객코드"]) + "</span>"
              + '<span class="d">' + esc(c["고객코드"] + (c.profile && c.profile["진행상태"] ? " · " + c.profile["진행상태"] : "")) + "</span></a>");
          });
        }
        if (terms.length) {
          html.push('<p class="suggest-label">보험 용어</p>');
          terms.forEach(function (t, i) {
            html.push('<button type="button" class="suggest-item" data-kind="term" data-i="' + i + '">'
              + '<span class="t">' + esc(t.termName) + "</span>"
              + '<span class="d">' + esc(t.definition || "") + "</span>"
              + '<span class="full" hidden>' + esc(t.definition || "") + "</span></button>");
          });
        }
        if (diseases.length) {
          html.push('<p class="suggest-label">질병 정보</p>');
          diseases.forEach(function (d, i) {
            html.push('<button type="button" class="suggest-item" data-kind="disease" data-i="' + i + '">'
              + '<span class="t">' + esc(d.name) + "</span>"
              + '<span class="d">' + esc(d.currentTreatment || "") + "</span>"
              + '<span class="full" hidden>' + esc(d.currentTreatment || "") + "</span></button>");
          });
        }
        if (!terms.length && !diseases.length && !custs.length) {
          // 결과 없음 — 입력값 원문 에코 + 다음 경로 안내 (카피덱 T2 recovery). 입력값은 보존된다.
          html.push('<p class="suggest-empty">'
            + (dictsFailed
              ? "사전 데이터를 불러오지 못했습니다."
              : "<strong>'" + esc(q) + "' 검색 결과가 없습니다.</strong>"
                + "<span>단어를 줄여 다시 검색하거나, 사례·판례 화면에서 조건으로 찾을 수 있습니다.</span>")
            + "</p>");
        }
        html.push('<button type="button" class="suggest-more" id="suggest-cases">사례·판례에서 "' + esc(q) + '" 검색</button>');
        panel.innerHTML = html.join("");
        panel.hidden = false;
      }

      var t;
      input.addEventListener("input", function () {
        clearTimeout(t);
        t = setTimeout(function () { loadDicts().then(suggest); }, 150);
      });
      input.addEventListener("focus", function () { loadDicts(); });
      input.addEventListener("keydown", function (e) {
        if (e.key === "Enter" && input.value.trim()) {
          window.location.href = "cases/?q=" + encodeURIComponent(input.value.trim());
        }
        if (e.key === "Escape") panel.hidden = true;
      });
      panel.addEventListener("click", function (e) {
        var more = e.target.closest("#suggest-cases");
        if (more) {
          window.location.href = "cases/?q=" + encodeURIComponent(input.value.trim());
          return;
        }
        var item = e.target.closest(".suggest-item");
        if (item) {
          var full = item.querySelector(".full");
          var brief = item.querySelector(".d");
          var open = full.hidden;
          full.hidden = !open;
          brief.hidden = open;
        }
      });
      document.addEventListener("click", function (e) {
        if (!e.target.closest(".global-search")) panel.hidden = true;
      });
    })();
  </script>


  <script>
  // 보장분석(데스크)으로 넘어갈 때 마이가디언 신원을 물려준다 (2026-08-13 사용자 확정).
  // 데스크는 자체 로그인을 갖지 않는다 — 팀원이 이미 여기 로그인해 둔 그 계정을 그대로 쓴다.
  // 세션은 눌린 순간에만 주소 조각(#s=)으로 붙는다. 조각은 서버로 전송되지 않고,
  // 데스크가 받자마자 주소에서 지운다. 링크 HTML 에는 토큰이 안 들어간다.
  document.addEventListener("click", function (e) {
    var a = e.target.closest && e.target.closest('a[href^="https://desk.insurguard.life"]');
    if (!a) return;
    var t = null;
    try { t = localStorage.getItem("mg_session"); } catch (err) {}
    if (!t) return;                    // 로그인 전이면 데스크가 열람키로 받는다
    a.href = "https://desk.insurguard.life/#s=" + encodeURIComponent(t);
  }, true);
  </script>
</body>
