<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <title>수정 요청 - 마이가디언</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="../assets/platform.css">
  <script src="../assets/platform.js"></script>
  <script src="../assets/auth.js"></script>
  <style>
    /* 이 화면 전용 — 괘선 목록. 카드·그림자 없이 헤어라인으로만 가른다(플랫폼 에디토리얼 문법).
       구성·문구·동작은 하랑지점의 「수정 요청」과 같다. 게시판은 따로다 — 마이가디언 요청은 마이가디언 서버에 쌓인다. */
    .rq-form { display: grid; grid-template-columns: 150px 1fr; gap: 8px; }
    .rq-form textarea { grid-column: 1 / -1; min-height: 96px; resize: vertical; }
    .rq-form select, .rq-form input, .rq-form textarea, .rq-admin select, .rq-admin input {
      font: inherit; font-size: 13px; border: 1px solid var(--platform-line-strong);
      border-radius: 4px; padding: 8px 10px; background: #fff; color: var(--platform-ink);
    }
    .rq-actions { display: flex; gap: 8px; align-items: center; margin-top: 10px; flex-wrap: wrap; }
    .rq-note { font-size: 12px; color: var(--platform-faint); margin: 6px 0 0; }
    .rq-list { border-top: 2px solid var(--platform-ink); margin-top: 12px; }
    .rq-item { border-bottom: 1px solid var(--platform-line); padding: 13px 4px; }
    .rq-head { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .rq-head strong { font-size: 14px; word-break: keep-all; }
    .rq-tag { font-size: 11px; color: var(--platform-muted); border: 1px solid var(--platform-line); border-radius: 3px; padding: 1px 6px; }
    .rq-body { font-size: 13px; line-height: 1.7; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; margin: 8px 0 0; }
    .rq-meta { font-size: 11.5px; color: var(--platform-faint); margin: 6px 0 0; }
    .rq-answer { border-left: 2px solid var(--platform-ink); padding: 2px 0 2px 12px; margin-top: 10px; font-size: 13px; line-height: 1.7; }
    .rq-answer b { margin-right: 6px; }
    .rq-admin { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--platform-line); }
    .rq-admin input { flex: 1; min-width: 160px; }
    .rq-shots { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
    .rq-shots:empty { display: none; }
    .rq-shot { display: inline-flex; flex-direction: column; gap: 4px; align-items: flex-start; }
    .rq-shot img { width: 132px; height: 88px; object-fit: cover; border: 1px solid var(--platform-line); border-radius: 4px; background: #eee; }
    .rq-done { margin-top: 18px; }
    .rq-done > summary { cursor: pointer; font-weight: 700; font-size: 13px; color: var(--platform-muted); padding: 6px 2px; }
    .rq-empty { padding: 26px 4px; font-size: 13px; color: var(--platform-faint); }
    @media (max-width: 720px) { .rq-form { grid-template-columns: 1fr; } }
  </style>
</head>
<body class="platform">
  <aside class="platform-sidebar" id="platform-sidebar">
    <a class="platform-brand" href="../" aria-label="마이가디언 홈"><span class="brand-mark"><img src="../assets/logo.svg" alt=""></span><span><span class="brand-name">마이가디언</span><span class="brand-caption">FC 업무 플랫폼</span></span></a>
    <nav class="platform-nav" aria-label="주요 메뉴">
      <p class="nav-group-label">업무</p>
      <a href="../">홈</a><a href="../customers/">고객관리</a><a href="../claims/">청구·지급</a><a href="../cases/">사례·판례</a><a href="../learn/">학습</a><a href="../brief/">브리핑</a>      <p class="nav-group-label">발행</p><a href="../care/shelf.html">케어센터</a><a href="../card/">카톡카드</a>
    </nav>
    <div class="sidebar-status"><strong>수정 요청</strong><span>마이가디언에 바라는 것을 적습니다.</span></div>
  </aside>
  <div class="platform-overlay" id="platform-overlay"></div>
  <div class="platform-shell">
    <header class="platform-topbar"><button class="mobile-menu" id="mobile-menu" type="button" aria-label="메뉴 열기" aria-expanded="false"><span></span></button><span class="mobile-brand">마이가디언</span><span class="topbar-context">수정 요청</span><span class="topbar-note">고쳐 달라는 것 · 새로 바라는 것</span></header>
    <main class="platform-main">
      <div class="page-heading">
        <p class="eyebrow">요청</p>
        <h1>수정 요청</h1>
        <p>프로그램에서 불편한 것, 있었으면 하는 것, 안 되는 것을 적어 주세요. 모두가 같이 봅니다 — 같은 생각이면 「나도 필요」를 눌러 주세요.</p>
      </div>

      <p id="gate" class="rq-empty" hidden></p>

      <div id="work" hidden>
        <section class="section-block">
          <div class="rq-form">
            <select id="req-kind" aria-label="종류">
              <option>프로그램 수정</option><option>기능 제안</option><option>오류 신고</option><option>기타</option>
            </select>
            <input type="text" id="req-title" maxlength="100" placeholder="한 줄 제목 — 예: 고객관리에서 미팅 저장이 안 돼요" aria-label="제목">
            <textarea id="req-body" maxlength="2000" placeholder="어느 화면에서 무엇을 했더니 어떻게 됐는지 적어 주시면 빨리 고칩니다. (어느 화면·어떤 기기인지는 자동으로 붙습니다)" aria-label="내용"></textarea>
          </div>
          <div class="rq-shots" id="req-shots"></div>
          <div class="rq-actions">
            <button class="btn btn-primary" type="button" id="req-send">보내기</button>
            <button class="btn" type="button" id="req-shot-add">화면 캡처 붙이기</button>
            <input type="file" id="req-file" accept="image/png,image/jpeg,image/webp" multiple hidden>
            <span class="rq-note" id="req-msg" style="margin:0"></span>
          </div>
          <p class="rq-note">캡처는 4장까지. 복사한 화면은 내용 칸에서 Ctrl+V로도 붙습니다. 고객 이름·연락처가 보이면 가리고 올려 주세요 — 요청은 전원이 봅니다.</p>
        </section>

        <section class="section-block">
          <div class="rq-list" id="req-list"></div>
        </section>
      </div>
    </main>
    <footer class="platform-footer">마이가디언 v2</footer>
  </div>

  <script>
    (function () {
      "use strict";
      // 모양·기능은 하랑지점 메뉴와 같고 게시판은 마이가디언 서버에 따로 있다(2026-09-20 사용자:
      // 「마이가디언 수정요청은 마이가디언에 있어야지」).
      var API = window.mgAuth.apiBase();
      var BADGE = { "접수": "st-hold", "진행 중": "st-meet", "완료": "st-met", "보류": "st-cancel" };
      var STATES = ["접수", "진행 중", "완료", "보류"];
      var token = window.mgAuth ? window.mgAuth.token() : null;
      var shots = [];                                   // [{ id, url }]

      function $(id) { return document.getElementById(id); }
      function esc(s) {
        return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
      }
      function gate(text) { $("gate").hidden = false; $("gate").textContent = text; $("work").hidden = true; }

      function api(path, opts) {
        opts = opts || {};
        return fetch(API + path, {
          method: opts.method || "GET",
          headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
          body: opts.body ? JSON.stringify(opts.body) : undefined
        }).then(function (r) {
          return r.json().catch(function () { return {}; }).then(function (j) {
            if (!r.ok) {
              var e = new Error(j.error || ("요청 실패 " + r.status));
              e.status = r.status;
              throw e;
            }
            return j;
          });
        });
      }

      // 어느 화면에서 넘어왔는지·어떤 기기인지 — 하랑지점과 같은 모양으로 자동으로 붙인다
      function context() {
        var ua = navigator.userAgent;
        var dev = /iPhone|iPad/.test(ua) ? "아이폰" : /Android/.test(ua) ? "안드로이드" : /Windows/.test(ua) ? "윈도우" : /Mac/.test(ua) ? "맥" : "기타";
        var names = { customers: "고객관리", claims: "청구·지급", cases: "사례·판례", learn: "학습", brief: "브리핑", care: "케어센터", card: "카톡카드", admin: "관리자 설정" };
        var from = "";
        try { from = (new URL(document.referrer).pathname.split("/web/")[1] || "").split("/")[0]; } catch (e) { /* 직접 열었다 */ }
        var standalone = window.matchMedia && window.matchMedia("(display-mode: standalone)").matches;
        return "화면: 마이가디언 " + (names[from] || (from === "" ? "홈" : from)) + " · " + dev
          + (standalone ? " 앱" : " 브라우저") + " · " + window.innerWidth + "×" + window.innerHeight;
      }

      // ── 화면 캡처 — 먼저 올려 번호를 받고, 보낼 때 그 번호를 싣는다 ──
      function drawShots() {
        $("req-shots").innerHTML = shots.map(function (s, i) {
          return '<span class="rq-shot"><img src="' + s.url + '" alt="붙인 캡처 ' + (i + 1) + '"><button type="button" class="btn" data-i="' + i + '" style="padding:2px 8px;font-size:12px">빼기</button></span>';
        }).join("");
      }
      function addShots(files) {
        var list = Array.prototype.slice.call(files || []).filter(function (f) { return /^image\/(png|jpeg|webp)$/.test(f.type); });
        if (!list.length) return;
        var room = 4 - shots.length;
        if (room <= 0) { $("req-msg").textContent = "캡처는 4장까지 붙일 수 있습니다."; return; }
        $("req-msg").textContent = "캡처를 올리는 중…";
        list.slice(0, room).reduce(function (p, f) {
          return p.then(function () {
            return fetch(API + "/requests/shots", { method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": f.type }, body: f })
              .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.status); return j; }); })
              .then(function (j) { shots.push({ id: j.id, url: URL.createObjectURL(f) }); drawShots(); });
          });
        }, Promise.resolve()).then(function () { $("req-msg").textContent = ""; })
          .catch(function (e) { $("req-msg").textContent = "캡처를 못 올렸습니다 — " + (e && e.message ? e.message : ""); });
      }
      $("req-shot-add").addEventListener("click", function () { $("req-file").click(); });
      $("req-file").addEventListener("change", function () { addShots(this.files); this.value = ""; });
      $("req-body").addEventListener("paste", function (e) {
        var fs = e.clipboardData && e.clipboardData.files;
        if (fs && fs.length) { e.preventDefault(); addShots(fs); }
      });
      $("req-shots").addEventListener("click", function (e) {
        var b = e.target.closest("button[data-i]"); if (!b) return;
        shots.splice(Number(b.dataset.i), 1); drawShots();          // 안 붙은 캡처는 서버가 하루 뒤 청소한다
      });
      // 목록의 캡처 — 인증이 필요해 img src로 바로 못 건다. 받아서 붙인다.
      function fillShots() {
        Array.prototype.forEach.call(document.querySelectorAll("#req-list img[data-shot]"), function (img) {
          fetch(API + "/requests/shots/" + img.dataset.shot, { headers: { Authorization: "Bearer " + token } })
            .then(function (r) { if (!r.ok) throw new Error(r.status); return r.blob(); })
            .then(function (b) { var u = URL.createObjectURL(b); img.src = u; img.parentNode.href = u; })
            .catch(function () { img.alt = "캡처를 못 불러왔습니다"; });
        });
      }

      function item(r) {
        return '<div class="rq-item" data-id="' + r.id + '">'
          + '<div class="rq-head"><span class="badge-status ' + (BADGE[r.status] || "st-hold") + '">' + esc(r.status) + "</span>"
          + '<span class="rq-tag">' + esc(r.kind) + "</span>"
          + "<strong>" + esc(r.title) + "</strong></div>"
          + (r.body ? '<p class="rq-body">' + esc(r.body) + "</p>" : "")
          + ((r.shots || []).length ? '<div class="rq-shots">' + r.shots.map(function (id) {
              return '<a class="rq-shot" target="_blank" rel="noopener"><img data-shot="' + id + '" alt="붙인 캡처"></a>';
            }).join("") + "</div>" : "")
          + '<p class="rq-meta">' + esc(r.author_name || r.author_email) + " · " + esc(String(r.created).slice(0, 10)) + (r.context ? " · " + esc(r.context) : "") + "</p>"
          + (r.answer ? '<div class="rq-answer"><b>' + esc(r.answered_by || "답변") + "</b>" + esc(r.answer) + "</div>" : "")
          + '<div class="rq-actions">'
          + (r.mine ? '<span class="rq-note" style="margin:0">내 요청' + (r.votes ? " · 나도 필요 " + r.votes : "") + "</span>"
                    : '<button type="button" class="btn req-vote' + (r.voted ? " btn-primary" : "") + '">나도 필요' + (r.votes ? " " + r.votes : "") + "</button>")
          + ((r.mine && r.status === "접수") || r.admin ? '<button type="button" class="btn req-del">지우기</button>' : "")
          + "</div>"
          + (r.admin
            ? '<div class="rq-admin"><select class="req-status" aria-label="상태" style="width:110px">'
              + STATES.map(function (s) { return "<option" + (s === r.status ? " selected" : "") + ">" + s + "</option>"; }).join("")
              + '</select><input class="req-ans" placeholder="답변 한 줄" aria-label="답변" value="' + esc(r.answer) + '">'
              + '<button type="button" class="btn btn-primary req-save">저장</button></div>'
            : "")
          + "</div>";
      }

      function load() {
        return api("/requests").then(function (list) {
          var open = list.filter(function (r) { return r.status === "접수" || r.status === "진행 중"; })
            .sort(function (a, b) { return b.votes - a.votes || b.id - a.id; });          // 많이 바라는 것이 위로
          var done = list.filter(function (r) { return r.status === "완료" || r.status === "보류"; });
          $("gate").hidden = true; $("work").hidden = false;
          $("req-list").innerHTML = (open.length ? open.map(item).join("") : '<p class="rq-empty">열려 있는 요청이 없습니다.</p>')
            + (done.length ? '<details class="rq-done"><summary>끝난 요청 ' + done.length + "건</summary>" + done.map(item).join("") + "</details>" : "");
          fillShots();
        });
      }

      $("req-send").addEventListener("click", function () {
        var title = $("req-title").value.trim();
        if (!title) { $("req-msg").textContent = "제목을 적어 주세요."; $("req-title").focus(); return; }
        var btn = this; btn.disabled = true;
        api("/requests", { method: "POST", body: { kind: $("req-kind").value, title: title, body: $("req-body").value, context: context(),
            shots: shots.map(function (s) { return s.id; }) } })
          .then(function () {
            $("req-title").value = ""; $("req-body").value = ""; shots = []; drawShots();
            $("req-msg").textContent = "보냈습니다. 처리되면 여기 상태가 바뀝니다.";
            return load();
          }).catch(function (e) { $("req-msg").textContent = e && e.message ? e.message : "보내지 못했습니다."; })
          .then(function () { btn.disabled = false; });
      });

      $("req-list").addEventListener("click", function (e) {
        var card = e.target.closest(".rq-item"); if (!card) return;
        var id = card.dataset.id;
        function fail(err) { window.alert(err && err.message ? err.message : "처리하지 못했습니다."); }
        if (e.target.closest(".req-vote")) { api("/requests/" + id + "/vote", { method: "POST" }).then(load).catch(fail); return; }
        if (e.target.closest(".req-del")) {
          if (!window.confirm("이 요청을 지울까요?")) return;
          api("/requests/" + id, { method: "DELETE" }).then(load).catch(fail);
          return;
        }
        if (e.target.closest(".req-save")) {
          api("/requests/" + id, { method: "POST", body: { status: card.querySelector(".req-status").value, answer: card.querySelector(".req-ans").value } })
            .then(load).catch(fail);
        }
      });

      if (!token) {
        gate("로그인이 필요합니다. 홈에서 구글 계정으로 로그인한 뒤 다시 열어 주세요.");
      } else {
        load().catch(function (e) {
          gate(e && e.status === 401 ? "로그인이 풀렸습니다. 홈에서 다시 로그인해 주세요."
            : "요청 목록을 불러오지 못했습니다 — " + (e && e.message ? e.message : ""));
        });
      }
    })();
  </script>
</body>
</html>
