<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>발표자 화면 - 브리핑 - 마이가디언</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="brief.css">
  <script src="../assets/vendor/pdfjs/pdf.min.js"></script>
  <script src="brief.js"></script>
</head>
<body class="brief-present">
  <header class="pr-topbar" id="topbar" hidden>
    <a class="pr-back" href="./" title="브리핑 라이브러리로 돌아갑니다">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>브리핑
    </a>
    <span class="pr-mode" id="mode-badge"></span>
    <span class="pr-doc-title" id="doc-title"></span>
    <div class="pr-top-right">
      <button class="pr-timer" id="timer" type="button" title="누르면 0:00부터 다시 잽니다" aria-label="경과 시간, 누르면 초기화">0:00</button>
      <button class="pr-button" id="pointer-toggle" type="button" aria-pressed="true">포인터 송신</button>
      <button class="pr-button primary" id="open-view" type="button">청중 화면 열기</button>
    </div>
  </header>

  <main class="pr-main" id="main" hidden>
    <div class="pr-stage-col">
      <div class="pr-stage-wrap stage-wrap" id="stage-wrap">
        <div class="stage" id="stage"></div>
      </div>
      <section class="pr-panel pr-next" id="next-panel" aria-label="다음 페이지 미리보기">
        <div class="pr-next-row">
          <p class="pr-panel-label">다음 페이지</p>
          <div class="pr-next-wrap stage-wrap" id="next-wrap">
            <div class="stage" id="next-stage"></div>
            <div class="pr-next-empty" id="next-empty" hidden>마지막</div>
          </div>
        </div>
      </section>
      <p class="pr-hint" id="hint">새로 열린 청중 창을 빔프로젝터·확장 모니터로 끌어 놓고 F 키를 누르면 전체화면이 됩니다. ←/→ 슬라이드 넘김, ↑/↓ 스크립트 스크롤.</p>
    </div>
    <aside class="pr-side">
      <section class="pr-panel pr-script" aria-label="발표 스크립트">
        <div class="pr-panel-label pr-script-head">
          <span>스크립트 — 청중 화면에는 표시되지 않습니다 · ↑/↓ 스크롤</span>
          <span class="pr-script-zoom">
            <button type="button" id="script-smaller" aria-label="스크립트 작게">가−</button>
            <button type="button" id="script-bigger" aria-label="스크립트 크게">가＋</button>
          </span>
        </div>
        <div class="pr-script-body" id="script-body"></div>
      </section>
    </aside>
  </main>

  <nav class="pr-nav" id="nav" aria-label="페이지 이동" hidden>
    <button class="pr-button" id="prev" type="button" aria-label="이전 페이지">←</button>
    <div class="pr-nav-pages" id="nav-pages"></div>
    <button class="pr-button" id="next" type="button" aria-label="다음 페이지">→</button>
    <span class="pr-count" id="count"></span>
  </nav>

  <div class="pr-error" id="error" hidden>
    <strong>문서를 열 수 없습니다.</strong>
    <p id="error-msg"></p>
    <p><a href="./">브리핑 진입 화면으로 돌아가기</a></p>
  </div>

  <script>
    (function () {
      "use strict";
      var B = window.mgBrief;
      var params = new URLSearchParams(window.location.search);
      var isLocal = params.get("local") === "1";

      var driver = null;
      var channelId = null;
      var briefRecord = null;
      var scriptPdf = null;       // 스크립트 PDF(원본 그대로 페이지 렌더). 텍스트 스크립트면 null
      var scriptPdfCount = 0;
      var scriptSeq = 0;
      var SCRIPT_BASE = 22;       // 텍스트 스크립트 기본 글자 크기(px)
      var scriptZoom = 1;
      try { scriptZoom = Math.min(2, Math.max(0.7, parseFloat(localStorage.getItem("mg-brief-script-zoom")) || 1)); } catch (e) {}
      var current = 1;
      var renderSeq = 0;
      var protocol = null;
      var transport = null;
      var pointerEnabled = true;
      var startedAt = Date.now();

      var stage = document.getElementById("stage");
      var stageWrap = document.getElementById("stage-wrap");
      var nextStage = document.getElementById("next-stage");
      var nextWrap = document.getElementById("next-wrap");

      function fail(message) {
        document.getElementById("error-msg").textContent = message;
        document.getElementById("error").hidden = false;
      }

      function videoEl() {
        return stage.querySelector("video");
      }

      function videoState() {
        var v = videoEl();
        if (!v) return null;
        return { playing: !v.paused && !v.ended, time: v.currentTime || 0 };
      }

      function bindVideo() {
        var v = videoEl();
        if (!v) return;
        v.addEventListener("play", function () { protocol.sendVideo("play", v.currentTime || 0); });
        v.addEventListener("pause", function () { protocol.sendVideo("pause", v.currentTime || 0); });
        v.addEventListener("seeked", function () { protocol.sendVideo("seek", v.currentTime || 0); });
      }

      // HTML 자료: iframe 스크롤을 비율로 송신
      var frameWin = null;
      // 슬라이드 안에서 누른 키는 다리가 postMessage로 올려 준다 (bindFrameScroll에서 받는다)
      var onKey = null;
      // 슬라이드 문서는 출처가 끊긴 iframe이라 DOM에 닿을 수 없다 — 다리가 알려준 값을 쓴다
      function scrollRatio() {
        return frameWin ? B.htmlScrollRatio(frameWin) : undefined;
      }

      // 장 넘김은 슬라이드 문서 안에서 일어난다. 다리가 바뀔 때마다 알려 주므로 그대로 중계한다.
      // 되풀이 송신도 함께 한다 — 청중 쪽이 한 번 어긋나면 스스로는 돌아오지 못하기 때문이다.
      var lastSlideSent = -1;
      var lastScrollSent = 0;
      var unbindFrame = null;
      var beatTimer = null;

      function bindFrameScroll(frame) {
        frameWin = frame.contentWindow;
        if (unbindFrame) unbindFrame();
        unbindFrame = B.bridgeListen(frameWin, function (d) {
          if (d.mgb === "key") {
            // 슬라이드 안에서 누른 스크립트 조작 키 — 발표자 화면이 받아 처리한다
            if (onKey) onKey({ key: d.key, target: document.body, preventDefault: function () {} }, true);
            return;
          }
          if (typeof d.slide === "number" && d.slide >= 0 && d.slide !== lastSlideSent) {
            lastSlideSent = d.slide;
            protocol.sendPage(d.slide);
          }
          if (typeof d.scroll === "number") {
            var now = Date.now();
            if (now - lastScrollSent >= 60) {
              lastScrollSent = now;
              protocol.sendScroll(d.scroll);
            }
          }
        });
        if (beatTimer) clearInterval(beatTimer);
        beatTimer = setInterval(function () {
          if (lastSlideSent >= 0) protocol.sendPage(lastSlideSent);
        }, 1500);
      }

      function updateNav() {
        document.querySelectorAll(".pr-page-btn").forEach(function (b) {
          b.classList.toggle("active", Number(b.dataset.page) === current);
        });
        var active = document.querySelector(".pr-page-btn.active");
        if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest", inline: "nearest" });
        document.getElementById("count").textContent = current + " / " + driver.count;
      }

      // 스크립트 PDF 문서를 미리 로드 (발표자 화면 전용 — 청중 창은 이 파일을 읽지 않는다)
      function loadScriptPdf() {
        var f = briefRecord && briefRecord["스크립트문서"];
        if (!f || !window.pdfjsLib) return Promise.resolve();
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "../assets/vendor/pdfjs/pdf.worker.min.js";
        return f.arrayBuffer()
          .then(function (buf) { return window.pdfjsLib.getDocument({ data: buf }).promise; })
          .then(function (pdf) { scriptPdf = pdf; scriptPdfCount = pdf.numPages; })
          .catch(function () { scriptPdf = null; }); // 실패하면 스크립트 없음으로 진행
      }

      // 스크립트 PDF 전체 페이지를 세로로 이어붙여 한 번만 렌더한다 (긴 두루마리).
      // 슬라이드와 분리 — 페이지 경계가 슬라이드와 안 맞아도 상관없이 자유 스크롤.
      function renderScriptPdfAll() {
        var container = document.getElementById("script-body");
        container.textContent = "";
        container.classList.remove("empty");
        var width = container.clientWidth || 500;
        for (var n = 1; n <= scriptPdfCount; n += 1) {
          (function (pageNum) {
            // 순서 보장: 캔버스를 먼저 순서대로 붙이고, 렌더는 비동기로 채운다
            var canvas = document.createElement("canvas");
            canvas.className = "pr-script-page";
            canvas.style.width = (100 * scriptZoom) + "%";
            canvas.style.height = "auto";
            canvas.style.display = "block";
            container.appendChild(canvas);
            scriptPdf.getPage(pageNum).then(function (page) {
              var raw = page.getViewport({ scale: 1 });
              var viewport = page.getViewport({ scale: (width / raw.width) * 2 }); // 2배 — 선명도
              canvas.width = viewport.width;
              canvas.height = viewport.height;
              page.render({ canvasContext: canvas.getContext("2d"), viewport: viewport });
            }).catch(function () {});
          })(n);
        }
      }

      // 스크립트 확대/축소 — 텍스트는 폰트, PDF(캔버스)는 표시 폭에 배율 적용. 설정은 저장.
      function applyScriptZoom() {
        var sb = document.getElementById("script-body");
        sb.style.fontSize = Math.round(SCRIPT_BASE * scriptZoom) + "px";
        sb.querySelectorAll("canvas").forEach(function (c) { c.style.width = (100 * scriptZoom) + "%"; });
        try { localStorage.setItem("mg-brief-script-zoom", String(scriptZoom)); } catch (e) {}
      }

      function zoomScript(delta) {
        scriptZoom = Math.min(2, Math.max(0.7, Math.round((scriptZoom + delta) * 100) / 100));
        applyScriptZoom();
      }

      function updateScript() {
        // 스크립트 PDF는 슬라이드와 분리 — 페이지를 넘겨도 그대로 둔다(직접 스크롤).
        if (scriptPdf) return;
        var scriptBody = document.getElementById("script-body");
        scriptBody.scrollTop = 0; // 페이지별 스크립트(문서/텍스트)는 넘길 때 맨 위부터
        var text = driver.scriptFor(current);
        if (text) {
          scriptBody.textContent = text;
          scriptBody.classList.remove("empty");
        } else {
          scriptBody.textContent = "이 페이지의 스크립트가 없습니다.";
          scriptBody.classList.add("empty");
        }
      }

      function goTo(n, silent) {
        n = Math.max(1, Math.min(driver.count, Math.round(n)));
        current = n;
        var seq = ++renderSeq;
        driver.mount(stage, n).then(function (frame) {
          if (seq !== renderSeq) return;
          stage.dataset.page = String(n);
          B.scaleStage(stageWrap, stage);
          bindVideo();
          if (frame) bindFrameScroll(frame);
        }).catch(function (err) {
          // 조용히 삼키면 페이지 번호만 넘어가고 화면은 이전 장에 머문다.
          // 발표자는 청중이 다른 것을 보고 있다는 사실을 모른다.
          if (seq !== renderSeq) return;
          document.getElementById("hint").textContent =
            n + "쪽을 그리지 못했습니다 — " + (err && err.message ? err.message : "알 수 없는 오류")
            + ". 청중 화면도 이 쪽을 보지 못합니다.";
        });

        updateScript();

        var hasNext = n < driver.count;
        document.getElementById("next-empty").hidden = hasNext;
        if (hasNext) {
          driver.mount(nextStage, n + 1).then(function () {
            if (seq !== renderSeq) return;
            B.scaleStage(nextWrap, nextStage);
          }).catch(function () {});
        } else {
          nextStage.textContent = "";
        }

        updateNav();
        if (!silent) protocol.sendPage(current);
      }

      function buildNav() {
        var box = document.getElementById("nav-pages");
        for (var i = 1; i <= driver.count; i += 1) {
          (function (n) {
            var b = document.createElement("button");
            b.type = "button";
            b.className = "pr-page-btn";
            b.dataset.page = String(n);
            b.textContent = String(n);
            b.addEventListener("click", function () { goTo(n); });
            box.appendChild(b);
          })(i);
        }
        document.getElementById("prev").addEventListener("click", function () { goTo(current - 1); });
        document.getElementById("next").addEventListener("click", function () { goTo(current + 1); });
      }

      // 청중 창은 새 창이라 발표자 창을 새로고침해도 캐시가 걷히지 않는다. 옛 view.html이
      // 남아 있으면 두 창의 코드 버전이 어긋나 발표 도중에 알 수 없는 실패가 난다.
      // 발표는 하루 몇 번뿐이므로 항상 새로 받는 편이 낫다.
      function viewUrl() {
        var fresh = "&_=" + Date.now();
        if (isLocal) return "view.html?local=1&ch=" + encodeURIComponent(channelId) + fresh;
        if (params.get("src")) return "view.html?src=" + encodeURIComponent(params.get("src")) + fresh;
        return "view.html?doc=" + encodeURIComponent(params.get("doc")) + fresh;
      }

      // 포인터 — 30ms 스로틀, 캔버스 기준 0~1 비율 좌표
      var lastSent = 0;
      var pointerOn = false;
      function sendPointer(e) {
        if (!pointerEnabled || driver.kind === "html") return;
        var now = Date.now();
        if (now - lastSent < 30) return;
        lastSent = now;
        var rect = stage.getBoundingClientRect();
        if (!rect.width || !rect.height) return;
        var x = (e.clientX - rect.left) / rect.width;
        var y = (e.clientY - rect.top) / rect.height;
        if (x < 0 || x > 1 || y < 0 || y > 1) return;
        pointerOn = true;
        protocol.sendPointer(Math.round(x * 1000) / 1000, Math.round(y * 1000) / 1000, true);
      }

      function pointerOff() {
        if (!pointerOn) return;
        pointerOn = false;
        protocol.sendPointer(0, 0, false);
      }

      function start() {
        document.title = "발표 — " + driver.title + " - 마이가디언";
        document.getElementById("doc-title").textContent = driver.title;
        document.getElementById("mode-badge").textContent = driver.mode || "브리핑";
        document.getElementById("topbar").hidden = false;
        document.getElementById("main").hidden = false;

        transport = B.createBroadcastTransport(B.channelName(channelId));
        protocol = B.createProtocol(transport, {
          // 청중 창이 뒤늦게 열리면 현재 상태를 보내 맞춘다 (자료 내용은 채널에 싣지 않는다)
          hello: function () {
            // 청중 창이 늦게 열려도 지금 장으로 맞춘다. HTML 자료의 장은 슬라이드 문서 안에 있다.
            var page = driver.kind === "html" && frameWin ? B.htmlSlideIndex(frameWin) : current;
            protocol.sendState(page < 0 ? current : page, videoState(), scrollRatio());
          }
        });

        if (driver.kind === "html") {
          // HTML 자료: 단일 문서 스크롤 동기화. 페이지 네비·포인터는 없다
          document.getElementById("nav").hidden = true;
          document.getElementById("next-panel").hidden = true;
          document.getElementById("hint").textContent =
            "장 넘김은 ← → , 스크립트는 ↑ ↓ 로 움직입니다. 스크롤은 청중 창에 동기화되며 포인터는 이 형식에서 지원되지 않습니다.";
        } else {
          document.getElementById("nav").hidden = false;
          buildNav();
        }

        goTo(1);
        if (scriptPdf) renderScriptPdfAll(); // 스크립트 PDF는 시작 시 전체를 한 번 렌더
        applyScriptZoom();
        document.getElementById("script-bigger").addEventListener("click", function () { zoomScript(0.15); this.blur(); });
        document.getElementById("script-smaller").addEventListener("click", function () { zoomScript(-0.15); this.blur(); });
        protocol.sendState(current, videoState(), scrollRatio());

        document.getElementById("open-view").addEventListener("click", function () {
          window.open(viewUrl(), "mg-brief-view-" + channelId);
          this.blur(); // 포커스가 버튼에 남으면 이후 키보드 넘김이 막힌다
        });

        var toggle = document.getElementById("pointer-toggle");
        if (driver.kind === "html") {
          toggle.hidden = true;
        } else {
          toggle.addEventListener("click", function () {
            pointerEnabled = !pointerEnabled;
            toggle.setAttribute("aria-pressed", String(pointerEnabled));
            if (!pointerEnabled) pointerOff();
          });
        }

        stageWrap.addEventListener("mousemove", sendPointer);
        stageWrap.addEventListener("mouseleave", pointerOff);
        stageWrap.addEventListener("click", function (e) {
          if (e.target.closest("video") || driver.kind === "html") return;
          goTo(current + 1);
        });

        // HTML 자료는 장 넘김을 자기 문서가 처리한다. 그런데 iframe에 포커스가 없으면
        // 그 처리기에 키가 닿지 않아 아무 일도 일어나지 않는다 — 발표자 화면이 대신 넣어 준다.
        // 포커스를 iframe으로 옮기지 않는 이유: 그러면 스크립트 스크롤(↑↓)과 글자 크기(+-)를
        // 발표자 화면이 못 받는다.
        function sendKeyToFrame(key) { B.htmlSendKey(frameWin, key); }

        // fromFrame = iframe 안에서 올라온 키. 장 넘김은 슬라이드 문서가 이미 처리했으므로
        // 여기서 또 넘기면 두 장씩 간다 — 스크립트 조작만 맡는다.
        onKey = function (e, fromFrame) {
          if (!fromFrame && e.target.closest("input, select, textarea")) return;
          var isHtml = driver.kind === "html";
          // Space는 포커스된 버튼을 활성화해야 하므로(접근성) 버튼 위에서는 제외.
          // 화살표는 버튼에 포커스가 남아 있어도 페이지 넘김으로 처리한다
          var onButton = !fromFrame && e.target.closest("button");
          if (e.key === "ArrowRight" || e.key === "PageDown" || (e.key === " " && !onButton)) {
            if (fromFrame) return;
            e.preventDefault();
            if (isHtml) sendKeyToFrame("ArrowRight"); else goTo(current + 1);
          } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
            if (fromFrame) return;
            e.preventDefault();
            if (isHtml) sendKeyToFrame("ArrowLeft"); else goTo(current - 1);
          } else if (e.key === "ArrowDown") {
            // 스크립트만 스크롤 — 슬라이드는 그대로
            e.preventDefault();
            document.getElementById("script-body").scrollBy({ top: 140, behavior: "smooth" });
          } else if (e.key === "ArrowUp") {
            e.preventDefault();
            document.getElementById("script-body").scrollBy({ top: -140, behavior: "smooth" });
          } else if (e.key === "+" || e.key === "=") {
            e.preventDefault();
            zoomScript(0.15); // 스크립트 글자 크게
          } else if (e.key === "-" || e.key === "_") {
            e.preventDefault();
            zoomScript(-0.15); // 스크립트 글자 작게
          }
        };
        document.addEventListener("keydown", function (e) { onKey(e, false); });

        // 슬라이드를 한 번 클릭하면 그다음 키는 iframe 문서로 간다. 장 넘김은 거기서
        // 처리되지만 스크립트 스크롤(↑↓)·글자 크기(+-)는 발표자 화면 몫이라 되돌려 받는다.
        var timer = document.getElementById("timer");
        setInterval(function () {
          var s = Math.floor((Date.now() - startedAt) / 1000);
          timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
        }, 1000);
        timer.addEventListener("click", function () { startedAt = Date.now(); });

        window.addEventListener("resize", function () {
          B.scaleStage(stageWrap, stage);
          B.scaleStage(nextWrap, nextStage);
        });
        window.addEventListener("beforeunload", function () { transport.close(); });
      }

      function boot(recordPromise, chFrom) {
        recordPromise.then(function (record) {
          if (!record) throw new Error("발표할 자료가 없습니다. 진입 화면에서 자료를 열어주세요.");
          channelId = chFrom(record);
          briefRecord = record;
          return B.createDriver(record, { audience: false });
        }).then(function (d) {
          driver = d;
          return loadScriptPdf();
        }).then(function () {
          start();
        }).catch(function (err) {
          fail(err && err.message ? err.message : String(err));
        });
      }

      if (isLocal) {
        boot(B.loadMaterial(), function (record) { return record.id; });
      } else if (params.get("src")) {
        boot(
          B.loadDocBySrc(params.get("src")).then(function (d) { return { kind: "doc", id: d.id, doc: d }; }),
          function (record) { return record.id; }
        );
      } else if (params.get("doc")) {
        boot(
          B.loadDocById(params.get("doc")).then(function (d) { return { kind: "doc", id: d.id, doc: d }; }),
          function (record) { return record.id; }
        );
      } else {
        fail("문서가 지정되지 않았습니다.");
      }
    })();
  </script>
</body>
</html>
