<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="../assets/logo.svg" type="image/svg+xml">
  <title>발표자 화면 - 브리핑 - 마이가디언</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css">

  <link rel="stylesheet" href="brief.css">
  <script src="../assets/auth.js"></script>

</head>
<body class="brief-present">
  <header class="pr-topbar" id="topbar" hidden>
    <a class="pr-back" href="./" title="브리핑 라이브러리로 돌아갑니다">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 6l-6 6 6 6"/></svg>브리핑
    </a>
    <span class="pr-mode" id="mode-badge"></span>
    <span class="pr-doc-title" id="doc-title"></span>
    <div class="pr-top-right">
      <button class="pr-timer" id="timer" type="button" title="발표 시간을 잽니다">시작</button>
      <span class="pr-pace" id="pace" hidden></span>
      <button class="pr-button" id="rehearse" type="button" hidden title="혼자 소리 내어 읽으며 장마다 시간·빠르기·빠뜨린 문장을 잽니다">리허설</button>
      <button class="pr-button" id="talk-end" type="button" hidden>끝내기</button>
      <button class="pr-button" id="veil-toggle" type="button" aria-pressed="false" title="청중 화면만 검게 가립니다 (B)">청중 가리기</button>
      <button class="pr-button" id="pointer-toggle" type="button" aria-pressed="true">포인터 송신</button>
      <span class="pr-view-state" id="view-state" role="status" hidden></span>
      <button class="pr-button primary" id="open-view" type="button">청중 화면 열기</button>
    </div>
  </header>

  <main class="pr-main" id="main" hidden>
    <div class="pr-stage-col">
      <div class="pr-stage-wrap stage-wrap" id="stage-wrap">
        <div class="stage" id="stage"></div>
      </div>
      <section class="pr-panel pr-next" id="next-panel" aria-label="다음 페이지 미리보기">
        <div class="pr-next-row">
          <p class="pr-panel-label">다음 페이지</p>
          <div class="pr-next-wrap stage-wrap" id="next-wrap">
            <div class="stage" id="next-stage"></div>
            <div class="pr-next-empty" id="next-empty" hidden>마지막</div>
          </div>
        </div>
      </section>
      <section class="pr-panel pr-notes" id="notes-panel" aria-label="받은 피드백" hidden>
        <p class="pr-panel-label" id="notes-head">받은 피드백</p>
        <ol class="pr-notes-list" id="notes-list"></ol>
      </section>
      <p class="pr-hint" id="hint">새로 열린 청중 창을 빔프로젝터·확장 모니터로 끌어 놓고 F 키를 누르면 전체화면이 됩니다. ←/→ 슬라이드 넘김, ↑/↓ 스크립트 스크롤, B 청중 가리기.</p>
    </div>
    <aside class="pr-side">
      <section class="pr-panel pr-script" aria-label="발표 스크립트">
        <div class="pr-panel-label pr-script-head">
          <span>스크립트 — 청중 화면에는 표시되지 않습니다 · ↑/↓ 스크롤</span>
          <span class="pr-script-zoom">
            <button type="button" id="script-smaller" aria-label="스크립트 작게">가−</button>
            <button type="button" id="script-bigger" aria-label="스크립트 크게">가＋</button>
            <button type="button" id="script-edit" hidden>고치기</button>
          </span>
        </div>
        <div class="pr-script-body" id="script-body"></div>
        <div class="pr-script-editor" id="script-editor" hidden>
          <textarea id="script-text" aria-label="이 장 스크립트 고치기"></textarea>
          <div class="pr-script-editor-row">
            <button type="button" class="pr-button primary" id="script-save">저장</button>
            <button type="button" class="pr-button" id="script-cancel">취소</button>
            <button type="button" class="pr-button" id="script-reset" hidden>팀 원본으로</button>
            <span id="script-msg"></span>
          </div>
        </div>
      </section>
    </aside>
  </main>

  <nav class="pr-nav" id="nav" aria-label="페이지 이동" hidden>
    <button class="pr-button" id="prev" type="button" aria-label="이전 페이지">←</button>
    <div class="pr-nav-pages" id="nav-pages"></div>
    <button class="pr-button" id="next" type="button" aria-label="다음 페이지">→</button>
    <span class="pr-count" id="count"></span>
  </nav>

  <!-- 손가락 조작 막대 — 폰·태블릿 전용. 키보드가 없고, HTML 자료는 페이지 넘김 막대가
       숨겨지므로 넘길 방법이 사라진다. 공부·발표 연습이 폰에서 이뤄지므로 반드시 필요하다. -->
  <div class="pr-touchbar" id="touchbar" hidden>
    <button class="pr-touch-btn" type="button" id="t-prev" aria-label="이전">‹</button>
    <button class="pr-touch-btn wide" type="button" id="t-fold" aria-pressed="false">슬라이드 보기</button>
    <button class="pr-touch-btn" type="button" id="t-next" aria-label="다음">›</button>
  </div>

  <div class="pr-error" id="error" hidden>
    <strong>문서를 열 수 없습니다.</strong>
    <p id="error-msg"></p>
    <p><a href="./">브리핑 진입 화면으로 돌아가기</a></p>
  </div>

  <script>
    (function () {
      "use strict";
      var B = window.mgBrief;
      var params = new URLSearchParams(window.location.search);
      var isLocal = params.get("local") === "1";

      var driver = null;
      var channelId = null;
      var briefRecord = null;
      var scriptPdf = null;       // 스크립트 PDF(원본 그대로 페이지 렌더). 텍스트 스크립트면 null
      var scriptPdfCount = 0;
      var scriptSeq = 0;
      var SCRIPT_BASE = 22;       // 텍스트 스크립트 기본 글자 크기(px)
      var scriptZoom = 1;
      try { scriptZoom = Math.min(2, Math.max(0.7, parseFloat(localStorage.getItem("mg-brief-script-zoom")) || 1)); } catch (e) {}
      var current = 1;
      var renderSeq = 0;
      var protocol = null;
      var transport = null;
      var pointerEnabled = true;
      var startedAt = null;       // 「시작」을 누른 때. 누르기 전에는 시간을 재지 않는다(2026-10-29 발표자 요청)
      var 가림 = false;           // 청중 화면을 가렸는지

      var stage = document.getElementById("stage");
      var stageWrap = document.getElementById("stage-wrap");
      var nextStage = document.getElementById("next-stage");
      var nextWrap = document.getElementById("next-wrap");

      function fail(message) {
        document.getElementById("error-msg").textContent = message;
        document.getElementById("error").hidden = false;
      }

      function videoEl() {
        return stage.querySelector("video");
      }

      function videoState() {
        var v = videoEl();
        if (!v) return null;
        return { playing: !v.paused && !v.ended, time: v.currentTime || 0 };
      }

      function bindVideo() {
        var v = videoEl();
        if (!v) return;
        v.addEventListener("play", function () { protocol.sendVideo("play", v.currentTime || 0); });
        v.addEventListener("pause", function () { protocol.sendVideo("pause", v.currentTime || 0); });
        v.addEventListener("seeked", function () { protocol.sendVideo("seek", v.currentTime || 0); });
      }

      // HTML 자료: iframe 스크롤을 비율로 송신
      var frameWin = null;
      // 슬라이드 안에서 누른 키는 다리가 postMessage로 올려 준다 (bindFrameScroll에서 받는다)
      var onKey = null;
      // 슬라이드 문서는 출처가 끊긴 iframe이라 DOM에 닿을 수 없다 — 다리가 알려준 값을 쓴다
      function scrollRatio() {
        return frameWin ? B.htmlScrollRatio(frameWin) : undefined;
      }

      // 장 넘김은 슬라이드 문서 안에서 일어난다. 다리가 바뀔 때마다 알려 주므로 그대로 중계한다.
      // 되풀이 송신도 함께 한다 — 청중 쪽이 한 번 어긋나면 스스로는 돌아오지 못하기 때문이다.
      var lastSlideSent = -1;
      var lastBeatSent = 0;    // 박자 장(연구회 덱 data-beats) — 한 장 안의 클릭 장면도 청중에 맞춘다(2026-10-14)
      var lastDoneSent = true;
      var 스크립트장 = 1;
      var 보인스크립트 = null;  // 지금 스크립트 칸에 띄운 글
      var 고치는구간 = null;    // 「고치기」로 여는 동안 그 구간 번호(1부터) — 그 사이 장이 바뀌어도 글 칸을 덮지 않는다      // HTML 자료의 스크립트 구간 — 다리가 알려 준 장 번호(0부터)+1   // 그 장의 장면이 다 보였는가 — 발표자가 → 로 즉시 완료하면 청중도 끝낸다
      var lastScrollSent = 0;
      // 청중 창이 알려 온 자리 — 발표자는 뒤의 빔프로젝터를 못 보므로 어긋나면 여기 띄운다(2026-10-18)
      var 청중자리 = null, 어긋난때 = 0;
      function 청중표시() {
        var el = document.getElementById("view-state");
        if (!청중자리 || Date.now() - 청중자리.at > 4000) {
          el.hidden = !청중자리;   // 한 번도 안 열었으면 감춘다
          el.className = "pr-view-state";
          el.textContent = "청중 화면 연결 끊김";
          return;
        }
        el.hidden = false;
        var html = driver && driver.kind === "html";
        var 내장 = html ? lastSlideSent : current, 내박자 = html ? lastBeatSent : 0;
        // 장 번호를 알려 주지 않는 자료(교육 덱·하이퍼프레임)는 키로 맞추므로 연결만 보인다
        if (청중자리.page < 0 || 내장 < 0 || 자리모드) { el.className = "pr-view-state"; el.textContent = "청중 화면 연결됨"; return; }
        var 장 = html ? 청중자리.page + 1 : 청중자리.page;
        var 글 = "청중 " + 장 + "장" + (청중자리.beat ? " · 장면 " + 청중자리.beat : "");
        if (청중자리.page === 내장 && 청중자리.beat === 내박자) { 어긋난때 = 0; el.className = "pr-view-state"; el.textContent = 글 + " · 맞음"; return; }
        if (!어긋난때) 어긋난때 = Date.now();
        // 따라가는 데 1초 남짓 걸린다 — 그동안은 어긋남으로 치지 않는다
        if (Date.now() - 어긋난때 < 2000) return;
        el.className = "pr-view-state off";
        el.textContent = 글 + " · 어긋남, 여기는 " + (html ? 내장 + 1 : 내장) + "장" + (내박자 ? " · 장면 " + 내박자 : "");
      }
      var unbindFrame = null;
      var beatTimer = null;
      // 청중 화면에도 같은 넘김 키를 방송한다. 자료 안에서 키가 올라오기를 기다리지 않는다 —
      // 자료가 자기 안에 또 iframe을 세우면 그 안에서 누른 키는 여기까지 안 온다
      // (2026-09-09 하이퍼프레임). 내가 넣은 키는 내가 안다.
      var 마지막넘김 = 0;
      // 자기 조종기를 내주는 자료는 자리(절대 위치)로 맞춘다 — 그때는 키를 방송하지 않는다.
      // 마우스로 넘기든 키로 넘기든 조종기가 알려 주므로 포커스가 어디 있든 맞는다.
      var 자리모드 = false;
      // 발표자 창을 새로고침해도 청중을 첫 장으로 끌고 가지 않는다(2026-09-27). 마지막 장(HTML은
      // 다리가 알려 준 번호·자리)을 자료별로 이 탭에 적어 두고, 다리가 서면 그 장으로 되돌린다.
      // 되돌리는 동안(복원)은 다리가 처음 알리는 첫 장을 방송하지 않는다.
      var 복원 = null;       // { slide:n } 또는 { pos:{…} }, until: 포기 시각
      var 복원봤다 = false;
      function 기억키() { return "mg-brief-last:" + channelId; }
      function 기억(v) { try { sessionStorage.setItem(기억키(), JSON.stringify(v)); } catch (e) {} }
      function 기억꺼내기() {
        try { return JSON.parse(sessionStorage.getItem(기억키()) || "null"); } catch (e) { return null; }
      }
      function 복원끝(맞았다) {
        if (복원 && (맞았다 || Date.now() > 복원.until)) 복원 = null;
        return !복원;
      }
      function 넘김방송(key) {
        if (자리모드) return;
        // 장 번호를 알려 주는 자료는 번호로 맞춘다 — 키까지 같이 보내면, 모션 도중의 누름이
        // 발표자에겐 「즉시 완료」인데 청중에겐 「다음 장」이 되어 한 장 앞서 갔다 돌아온다.
        if (frameWin && B.htmlSlideIndex(frameWin) >= 0) return;
        마지막넘김 = Date.now();
        if (protocol) protocol.send넘김(key);
      }

      function bindFrameScroll(frame) {
        frameWin = frame.contentWindow;
        // 자료의 영상 동기화 통로를 이 발표의 채널 이름으로 잇는다(발표자 역할)
        B.html연결(frameWin, channelId, false);
        if (unbindFrame) unbindFrame();
        unbindFrame = B.bridgeListen(frameWin, function (d) {
          if (d.mgb === "자리있음") {
            자리모드 = true;
            var 옛자리 = 기억꺼내기();
            // 자리있음은 다리마다 한 번만 온다
            if (옛자리 && 옛자리.pos) {
              복원 = { pos: 옛자리.pos, until: Date.now() + 4000 };
              B.html자리(frameWin, 옛자리.pos);
            }
            return;
          }
          if (d.mgb === "자리") {
            var 같다 = 복원 && 복원.pos && 복원.pos.sequenceId === d.pos.sequenceId
              && 복원.pos.slideIndex === d.pos.slideIndex && 복원.pos.fragmentIndex === d.pos.fragmentIndex;
            if (!복원끝(같다)) return;
            기억({ pos: d.pos });
            if (protocol) protocol.send자리(d.pos);
            return;
          }
          if (d.mgb === "넘김") {
            // 자료가 장 목록을 자기 안에 감추면 쪽 번호로 못 맞춘다 — 키를 그대로 넘긴다.
            // 내가 방금 넣은 키가 되돌아온 것이면 버린다. 두 번 보내면 두 장씩 넘어간다.
            if (Date.now() - 마지막넘김 > 400) 넘김방송(d.key);
            return;
          }
          if (d.mgb === "key") {
            // 슬라이드 안에서 누른 스크립트 조작 키 — 발표자 화면이 받아 처리한다
            if (onKey) onKey({ key: d.key, target: document.body, preventDefault: function () {} }, true);
            return;
          }
          if (typeof d.slide === "number" && d.slide >= 0) {
            if (!복원봤다) {
              복원봤다 = true;
              var 옛장 = 기억꺼내기();
              if (옛장 && typeof 옛장.slide === "number" && 옛장.slide !== d.slide && 옛장.slide < d.count) {
                복원 = { slide: 옛장.slide, until: Date.now() + 4000 };
                B.htmlSlideGoTo(frameWin, 옛장.slide);
              }
            }
            if (복원끝(복원 && d.slide === 복원.slide) && (d.slide !== lastSlideSent || d.beat !== lastBeatSent || d.done !== lastDoneSent)) {
              var 장바뀜 = d.slide !== lastSlideSent;
              lastSlideSent = d.slide;
              lastBeatSent = d.beat || 0;
              lastDoneSent = d.done !== false;
              기억({ slide: d.slide });
              protocol.sendPage(d.slide, lastBeatSent, lastDoneSent);
              // 장이 바뀌면 그 장의 스크립트 구간으로 — 박자만 바뀔 때는 읽던 자리를 두고 간다(지금 박자 문단만 밝힌다)
              지금박자 = d.beat || 0; 지금박자수 = d.beats || 0;
              if (장바뀜) { 스크립트장 = d.slide + 1; updateScript(); }
              박자강조();
            }
          }
          if (typeof d.scroll === "number") {
            var now = Date.now();
            if (now - lastScrollSent >= 60) {
              lastScrollSent = now;
              protocol.sendScroll(d.scroll);
            }
          }
        });
        if (beatTimer) clearInterval(beatTimer);
        beatTimer = setInterval(function () {
          if (lastSlideSent >= 0) protocol.sendPage(lastSlideSent, lastBeatSent, lastDoneSent);
        }, 1500);
      }

      function updateNav() {
        document.querySelectorAll(".pr-page-btn").forEach(function (b) {
          b.classList.toggle("active", Number(b.dataset.page) === current);
        });
        var active = document.querySelector(".pr-page-btn.active");
        if (active && active.scrollIntoView) active.scrollIntoView({ block: "nearest", inline: "nearest" });
        document.getElementById("count").textContent = current + " / " + driver.count;
      }

      // 스크립트 PDF 문서를 미리 로드 (발표자 화면 전용 — 청중 창은 이 파일을 읽지 않는다)
      function loadScriptPdf() {
        var f = briefRecord && briefRecord["스크립트문서"];
        if (!f || !window.pdfjsLib) return Promise.resolve();
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = "../assets/vendor/pdfjs/pdf.worker.min.js";
        return f.arrayBuffer()
          .then(function (buf) { return window.pdfjsLib.getDocument({ data: buf }).promise; })
          .then(function (pdf) { scriptPdf = pdf; scriptPdfCount = pdf.numPages; })
          .catch(function () { scriptPdf = null; }); // 실패하면 스크립트 없음으로 진행
      }

      // 스크립트 PDF 전체 페이지를 세로로 이어붙여 한 번만 렌더한다 (긴 두루마리).
      // 슬라이드와 분리 — 페이지 경계가 슬라이드와 안 맞아도 상관없이 자유 스크롤.
      function renderScriptPdfAll() {
        var container = document.getElementById("script-body");
        container.textContent = "";
        container.classList.remove("empty");
        var width = container.clientWidth || 500;
        for (var n = 1; n <= scriptPdfCount; n += 1) {
          (function (pageNum) {
            // 순서 보장: 캔버스를 먼저 순서대로 붙이고, 렌더는 비동기로 채운다
            var canvas = document.createElement("canvas");
            canvas.className = "pr-script-page";
            canvas.style.width = (100 * scriptZoom) + "%";
            canvas.style.height = "auto";
            canvas.style.display = "block";
            container.appendChild(canvas);
            scriptPdf.getPage(pageNum).then(function (page) {
              var raw = page.getViewport({ scale: 1 });

            // 발표자 화면에도 전체화면이 있어야 한다 — 청중 창 없이 노트북 하나로
            // 발표하는 자리가 있다. fromFrame은 제외한다: 슬라이드 문서가 이미 자기를
            // 전체화면으로 만들었으므로 여기서 또 걸면 두 번 겹친다.
            e.preventDefault();
            B.toggleFullscreen();
          }
        };
        document.addEventListener("keydown", function (e) { onKey(e, false); });

        // 슬라이드를 한 번 클릭하면 그다음 키는 iframe 문서로 간다. 장 넘김은 거기서
        // 처리되지만 스크립트 스크롤(↑↓)·글자 크기(+-)는 발표자 화면 몫이라 되돌려 받는다.
        // ── 손가락 조작 (폰·태블릿)
        (function () {
          var bar = document.getElementById("touchbar");
          var fold = document.getElementById("t-fold");
          bar.hidden = false;
          function 넘기기(dir) {
            if (driver.kind === "html") sendKeyToFrame(dir > 0 ? "ArrowRight" : "ArrowLeft");
            else goTo(current + dir);
          }
          document.getElementById("t-prev").addEventListener("click", function () { 넘기기(-1); });
          document.getElementById("t-next").addEventListener("click", function () { 넘기기(1); });
          // 폰은 화면이 좁다. 슬라이드와 스크립트를 함께 띄우면 둘 다 어중간해진다 —
          // 한 번에 하나만 보이고 이 단추로 오간다. 기본은 스크립트(공부·연습이 주 쓰임).
          fold.addEventListener("click", function () {
            var 슬라이드 = document.body.classList.toggle("show-slide");
            fold.setAttribute("aria-pressed", String(슬라이드));
            fold.textContent = 슬라이드 ? "스크립트 보기" : "슬라이드 보기";
            // 접혀 있던 쪽이 펼쳐지면 크기를 다시 맞춘다
            if (슬라이드) B.scaleStage(stageWrap, stage);
          });
        })();

        // 발표 시간 — 자료를 연 때가 아니라 「시작」을 누른 때부터 잰다. 「끝내기」로 멈춘다.
        // 로그인했고 상담 자료가 아니면 발표 기록이 열린다(2026-10-29 발표자 요청): 팀원이 브리핑 「지금 발표 중」에서
        // 장마다 피드백을 보내면 아래 「받은 피드백」에 쌓이고, 끝내면 장마다 머문 시간과 AI 정리가 기록에 남는다.
        var timer = document.getElementById("timer");
        var endBtn = document.getElementById("talk-end");
        var 기록 = null;                       // { id, 장, 들어온때, 장시간:[{장,초}], 마지막피드백, 리허설, 말:{장:글} }
        var 계획 = null;                       // 같은 자료의 내 마지막 기록에서 장마다 머문 초 — 진행 속도 기준
        var 계획출처 = "";
        var paceEl = document.getElementById("pace");
        var rehearseBtn = document.getElementById("rehearse");
        var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        function 분초(s) { s = Math.abs(Math.round(s)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }
        // 진행 속도 — 지금 장 앞까지의 예정 시간 + 이 장 예정 안에서 흐른 시간을 실제 흐른 시간과 견준다
        function 속도표시() {
          if (!계획 || !기록 || startedAt === null) { paceEl.hidden = true; return; }
          var n = 지금장(), 예정 = 0;
          Object.keys(계획).forEach(function (k) { if (Number(k) < n) 예정 += 계획[k]; });
          var 이장 = 계획[n] || 0, 머묾 = (Date.now() - 기록.들어온때) / 1000;
          예정 += Math.min(이장, 머묾);
          var 차이 = (Date.now() - startedAt) / 1000 - 예정;
          paceEl.hidden = false;
          paceEl.className = "pr-pace" + (차이 > 60 ? " late" : "");
          paceEl.textContent = (Math.abs(차이) < 15 ? "예정대로" : "예정보다 " + 분초(차이) + (차이 > 0 ? " 늦음" : " 빠름"))
            + (이장 ? " · 이 장 " + 분초(머묾) + " / " + 분초(이장) : "");
          paceEl.title = "기준: " + 계획출처 + " 기록";
        }
        function 지금장() { return driver.kind === "html" ? 스크립트장 : current; }
        function 시간표시() {
          if (startedAt === null) { timer.textContent = "시작"; timer.classList.remove("on"); return; }
          var s = Math.floor((Date.now() - startedAt) / 1000);
          timer.textContent = Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
          timer.classList.add("on");
        }
        function 장넘김기록(끝) {
          if (!기록) return;
          var n = 지금장(), 지금 = Date.now();
          if (n === 기록.장 && !끝) return;
          var 초 = Math.round((지금 - 기록.들어온때) / 1000);
          if (초 > 0) 기록.장시간.push({ 장: 기록.장, 초: 초 });
          기록.장 = n; 기록.들어온때 = 지금;
          if (!끝) 알림();
        }
        function 알림() {
          if (기록) window.mgAuth.api("/brief/talks/now", { method: "POST", body: { id: 기록.id, 장: 기록.장 } }).catch(function () {});
        }
        function 피드백받기() {
          if (!기록) return;
          window.mgAuth.api("/brief/talks/notes?id=" + 기록.id + "&after=" + 기록.마지막피드백).then(function (list) {
            if (!기록 || !list.length) return;
            var ol = document.getElementById("notes-list");
            list.forEach(function (n) {
              기록.마지막피드백 = Math.max(기록.마지막피드백, n.id);
              var li = document.createElement("li");
              li.className = "pr-note k-" + n.종류;
              li.textContent = n.장 + "장 · " + n.종류 + (n.글 ? " — " + n.글 : "") + " · " + n.누가;
              ol.insertBefore(li, ol.firstChild);
            });
            document.getElementById("notes-head").textContent = "받은 피드백 " + ol.children.length;
          }).catch(function () {});
        }
        setInterval(function () { 시간표시(); 장넘김기록(false); 속도표시(); }, 1000);
        setInterval(알림, 30000);
        setInterval(피드백받기, 5000);
        var 로그인 = !!(window.mgAuth && window.mgAuth.token());
        var 기록가능 = 로그인 && driver.mode !== "상담";
        rehearseBtn.hidden = !기록가능 || !SR;
        if (기록가능) {
          window.mgAuth.api("/brief/talks/plan?doc=" + encodeURIComponent(channelId)).then(function (r) {
            if (r.장 && Object.keys(r.장).length) { 계획 = r.장; 계획출처 = r.출처; }
          }).catch(function () {});
        }
        function 시작하기(리허설) {
          if (startedAt !== null) return;
          startedAt = Date.now();
          시간표시();
          endBtn.hidden = false;
          rehearseBtn.hidden = true;
          if (!기록가능) return;
          var 제목 = (briefRecord && briefRecord["제목"]) || document.getElementById("doc-title").textContent || "발표";
          window.mgAuth.api("/brief/talks", { method: "POST", body: { 제목: 제목, 모드: driver.mode || "", 장수: driver.count || 0, 자료: channelId, 리허설: !!리허설 } })
            .then(function (r) {
              기록 = { id: r.id, 장: 지금장(), 들어온때: Date.now(), 장시간: [], 마지막피드백: 0, 리허설: !!리허설, 말: {} };
              if (리허설) { 받아적기(); return; }
              document.getElementById("notes-panel").hidden = false;
              document.getElementById("notes-list").textContent = "";
              document.getElementById("notes-head").textContent = "받은 피드백 — 팀원은 브리핑 「지금 발표 중」에서 보냅니다";
              알림();
            }).catch(function () { /* 서버가 안 되면 시간만 잰다 */ });
        }
        timer.addEventListener("click", function () { this.blur(); 시작하기(false); });
        // 리허설(2026-10-29 발표자) — 혼자 스크립트를 소리 내어 읽으며 넘긴다. 들은 말은 그때 띄운 장에 붙는다.
        // 끝내면 장마다 시간·말 빠르기·스크립트를 말한 비율·빠뜨린 문장이 기록에 「리허설」로 남고, 다음 발표의 진행 속도 기준이 된다.
        var 듣기 = null;
        function 받아적기() {
          if (!기록 || !기록.리허설) return;
          var rec = new SR();
          rec.lang = "ko-KR"; rec.continuous = true; rec.interimResults = false;
          rec.onresult = function (e) {
            if (!기록) return;
            for (var i = e.resultIndex; i < e.results.length; i++) {
              if (!e.results[i].isFinal) continue;
              var n = 지금장();
              기록.말[n] = (기록.말[n] || "") + " " + e.results[i][0].transcript;
            }
          };
          rec.onerror = function (e) {
            if (e.error === "not-allowed" || e.error === "service-not-allowed") { 듣기 = null; window.alert("마이크를 쓸 수 없어 리허설은 시간만 잽니다. 주소창 왼쪽에서 마이크를 허용하세요."); }
          };
          // 음성 인식은 오래 조용하면 저절로 끝난다 — 리허설이 이어지는 동안 다시 켠다
          rec.onend = function () { if (듣기 === rec && 기록 && 기록.리허설) setTimeout(받아적기, 300); };
          듣기 = rec;
          try { rec.start(); } catch (e) { 듣기 = null; }
        }
        rehearseBtn.addEventListener("click", function () { this.blur(); 시작하기(true); });
        endBtn.addEventListener("click", function () {
          this.blur();
          if (!window.confirm(기록 && 기록.리허설 ? "리허설을 끝낼까요?" : "발표를 끝낼까요?")) return;
          var 총 = Math.floor((Date.now() - startedAt) / 1000);
          startedAt = null;
          endBtn.hidden = true;
          rehearseBtn.hidden = !기록가능 || !SR;
          if (듣기) { var d = 듣기; 듣기 = null; try { d.stop(); } catch (e) {} }
          시간표시();
          if (!기록) { window.alert("발표 시간 " + Math.floor(총 / 60) + "분 " + (총 % 60) + "초"); return; }
          장넘김기록(true);
          var 끝낸것 = 기록;
          기록 = null;
          // 스크립트는 AI 정리에만 쓰고 서버에 남지 않는다. 장마다 나눈 스크립트일 때만 보낸다.
          var 스크립트 = {};
          var 나눔 = !scriptPdf && (driver.kind !== "html" || (Array.isArray(briefRecord && briefRecord["스크립트"]) && briefRecord["스크립트"].length > 1));
          if (나눔) 끝낸것.장시간.forEach(function (x) { var s = driver.scriptFor(x.장); if (s) 스크립트[x.장] = String(s).slice(0, 2000); });
          var 분석 = 끝낸것.리허설 ? 리허설분석(끝낸것, 나눔) : [];
          window.open("talk.html?id=" + 끝낸것.id, "_blank");   // 정리는 기록 화면에서 기다린다 — 발표 창은 그대로 둔다
          window.mgAuth.api("/brief/talks/end", { method: "POST", body: { id: 끝낸것.id, 장시간: 끝낸것.장시간, 스크립트: 스크립트, 분석: 분석 } })
            .then(function () { 계획 = null; return window.mgAuth.api("/brief/talks/plan?doc=" + encodeURIComponent(channelId)); })
            .then(function (r) { if (r && r.장 && Object.keys(r.장).length) { 계획 = r.장; 계획출처 = r.출처; } })
            .catch(function () {});
        });

        // 리허설 분석 — 장마다: 말 빠르기(말한 음절 / 머문 초), 스크립트를 말한 비율, 빠뜨린 문장(반도 안 말한 문장).
        // 스크립트가 장마다 나뉘어 있지 않으면 빠르기만 잰다.
        function 리허설분석(끝낸것, 나눔) {
          var 초 = {};
          끝낸것.장시간.forEach(function (x) { 초[x.장] = (초[x.장] || 0) + x.초; });
          return Object.keys(초).map(Number).map(function (n) {
            var 말 = 끝낸것.말[n] || "";
            var 음절 = 말.replace(/[^가-힣a-zA-Z0-9]/g, "").length;
            var 결과 = { 장: n, 빠르기: 음절 && 초[n] ? 음절 / 초[n] : null, 덮음: null, 빠뜨림: [] };
            var s = 나눔 ? String(driver.scriptFor(n) || "") : "";
            if (s.trim()) {
              var 전체 = B.겹친글자수(s, 말);
              결과.덮음 = 전체.길이 ? 전체.겹침 / 전체.길이 : null;
              결과.빠뜨림 = s.split(/(?<=[.?!])\s+|\n+/).map(function (x) { return x.trim(); }).filter(function (x) {
                var r = B.겹친글자수(x, 말);
                return r.길이 >= 6 && r.겹침 / r.길이 < 0.5;
              }).slice(0, 6);
            }
            return 결과;
          });
        }

        // 청중 가리기 — 질문을 받거나 자료 밖 이야기를 할 때 청중 화면만 검게 둔다(2026-10-29 발표자 요청).
        var veilBtn = document.getElementById("veil-toggle");
        function 가리기(on) {
          가림 = on;
          veilBtn.setAttribute("aria-pressed", String(on));
          veilBtn.textContent = on ? "청중 화면 보이기" : "청중 가리기";
          protocol.send가림(on);
        }
        veilBtn.addEventListener("click", function () { 가리기(!가림); this.blur(); });

        window.addEventListener("resize", function () {
          B.scaleStage(stageWrap, stage);
          B.scaleStage(nextWrap, nextStage);
        });
        window.addEventListener("beforeunload", function () { transport.close(); });
      }

      function boot(recordPromise, chFrom) {
        recordPromise.then(function (record) {
          if (!record) throw new Error("발표할 자료가 없습니다. 진입 화면에서 자료를 열어주세요.");
          channelId = chFrom(record);
          briefRecord = record;
          return B.createDriver(record, { audience: false });
        }).then(function (d) {
          driver = d;
          return loadScriptPdf();
        }).then(function () {
          start();
        }).catch(function (err) {
          fail(err && err.message ? err.message : String(err));
        });
      }

      if (isLocal) {
        boot(B.loadMaterial(), function (record) { return record.id; });
      } else if (params.get("src")) {
        boot(
          B.loadDocBySrc(params.get("src")).then(function (d) { return { kind: "doc", id: d.id, doc: d }; }),
          function (record) { return record.id; }
        );
      } else if (params.get("doc")) {
        boot(
          B.loadDocById(params.get("doc")).then(function (d) { return { kind: "doc", id: d.id, doc: d }; }),
          function (record) { return record.id; }
        );
      } else {
        fail("문서가 지정되지 않았습니다.");
      }
    })();
  </script>
</body>
