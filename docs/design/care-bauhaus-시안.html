<!--
조판 판단 근거
1. 종이색의 넓은 여백과 삼원색의 큰 면을 교차시켜 바우하우스 포스터의 긴장감을 만든다.
2. 기사 번호는 단일 숫자를 원 안에 두고, 카테고리는 가로 색 띠로 분리해 도형을 정보 구조로 사용한다.
3. 390px에서는 본문을 17.5px/1.78로 유지하고, 데스크톱에서는 비대칭 12열 격자로 표지와 본문 폭을 엇갈리게 배치한다.
4. 원문의 수치 문장·인용·탭 데이터만 사각 강조 블록과 비교표로 전환해 새 문구를 보태지 않는다.
-->

  <script>
    (()=>{
      "use strict";
      const encoded=document.getElementById("issue-data").textContent.trim();
      const bytes=Uint8Array.from(atob(encoded),c=>c.charCodeAt(0));
      const issue=JSON.parse(new TextDecoder("utf-8").decode(bytes));
      const articles=issue["기사"],editor=issue["편집장의말"];
      const el=(tag,className,text)=>{const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n};
      const idOf=a=>"article-"+a["번호"];
      document.getElementById("masthead-deck").textContent=editor.at(-1);
      document.getElementById("footer-role").textContent=editor.at(-1);
      const editorCopy=document.getElementById("editor-copy");
      editor.slice(0,-1).forEach(text=>editorCopy.append(el("p","",text)));
      editorCopy.append(el("div","editor-sign",editor.at(-1)));
      const toc=document.getElementById("toc");
      articles.forEach(a=>{const li=el("li","toc__item"),link=el("a","toc__link"),copy=el("div","toc__copy");link.href="#"+idOf(a);link.append(el("div","toc__number",String(a["번호"])));copy.append(el("div","toc__category",a["카테고리"]));copy.append(el("div","toc__name",a["제목"]));copy.append(el("p","toc__sub",a["부제"]));link.append(copy);li.append(link);toc.append(li)});
      const isStat=text=>{const p=text.indexOf(" — ");return p>0&&/\d/.test(text.slice(0,p))};
      const isAdvice=text=>/^(첫째|둘째|셋째|넷째|다섯째|마지막으로),/.test(text);
      const isExample=text=>/^(예를 들어|다른 예시로)/.test(text);
      const isNote=text=>!isAdvice(text)&&!isExample(text)&&/(반드시|꼼꼼히 확인|정확히 이해|주의해야|유의해야)/.test(text);
      const isStatement=text=>text.length<=58&&!/[.!?。]$/.test(text)&&!isAdvice(text);
      const navHeads=new Set(["다음 칼럼","이전 칼럼","목록으로"]);
      function splitProse(text){
        if(text.length<190)return[text];
        const sentences=(text.match(/.*?(?:[.!?。]+["'’”)]*(?=\s|$)|$)/g)||[text]).filter(Boolean),chunks=[];let current="";
        sentences.forEach(sentence=>{const part=sentence.trim();if(!part)return;if(current&&current.length+part.length>175){chunks.push(current);current=part}else current+=(current?" ":"")+part});
        if(current)chunks.push(current);return chunks
      }
      function prose(tag,className,text){const node=el(tag,className);splitProse(text).forEach((part,index)=>{if(index)node.append(document.createTextNode(" "));node.append(el("span","paragraph-chunk",part))});return node}
      function stat(text){const p=text.indexOf(" — "),box=el("aside","stat");box.append(el("strong","stat__value",text.slice(0,p)));box.append(el("span","stat__copy",text.slice(p+3)));return box}
      function table(headers,rows){const figure=el("figure","comparison"),scroll=el("div","table-scroll"),table=el("table"),thead=el("thead"),hr=el("tr");headers.forEach(v=>hr.append(el("th","",v)));thead.append(hr);table.append(thead);const tbody=el("tbody");rows.forEach(row=>{const tr=el("tr");row.forEach(v=>tr.append(el("td","",v)));tbody.append(tr)});table.append(tbody);scroll.append(table);figure.append(scroll);return figure}
      function articleNav(blocks){const nav=el("nav","article-nav");nav.setAttribute("aria-label","기사 이동");let type="";blocks.forEach(b=>{if(b.t!=="h")return;if(b.x==="다음 칼럼"||b.x==="이전 칼럼"){type=b.x;return}if(b.x==="목록으로")return;if(type){const found=articles.find(a=>a["제목"]===b.x),a=el("a");a.href=found?"#"+idOf(found):"#contents";a.append(el("span","nav-type",type),el("span","nav-title",b.x));nav.append(a);type=""}});return nav}
      function renderBody(blocks){const outer=el("div","article-body"),grid=el("div","body-grid"),column=el("div","reading-column");grid.append(column);outer.append(grid);const navAt=blocks.findIndex(b=>b.t==="h"&&navHeads.has(b.x)),content=navAt<0?blocks:blocks.slice(0,navAt),navData=navAt<0?[]:blocks.slice(navAt);let i=0;
        while(i<content.length){const b=content[i];
          if(b.t==="h"&&b.x.includes("\t")){const headers=b.x.split("\t"),rows=[];i++;while(i<content.length&&content[i].t==="p"&&content[i].x.includes("\t")){rows.push(content[i].x.split("\t"));i++}column.append(table(headers,rows));continue}
          if(b.t==="p"&&b.x.includes("\t")){const rows=[];while(i<content.length&&content[i].t==="p"&&content[i].x.includes("\t")){rows.push(content[i].x.split("\t"));i++}column.append(table(rows[0],rows.slice(1)));continue}
          if(b.t==="h"){const section=el("section","body-section");section.append(el("h2","body-heading",b.x));column.append(section)}
          else if(isStat(b.x))column.append(stat(b.x));
          else if(isAdvice(b.x))column.append(prose("aside","advice",b.x));
          else if(isExample(b.x)||isNote(b.x))column.append(prose("aside","note",b.x));
          else if(isStatement(b.x))column.append(prose("p","statement",b.x));
          else column.append(prose("p","body-paragraph",b.x));
          i++;
        }
        if(navData.length){const nav=articleNav(navData);if(nav.children.length)column.append(nav)}
        const back=el("a","back","목록으로");back.href="#contents";column.append(back);return outer
      }
      function emphasize(node,phrase){
        if(!node||!phrase)return false;
        const walker=document.createTreeWalker(node,NodeFilter.SHOW_TEXT);let textNode;
        while((textNode=walker.nextNode())){const index=textNode.data.indexOf(phrase);if(index<0)continue;const mark=el("mark","key-hit",phrase),after=textNode.splitText(index);after.deleteData(0,phrase.length);after.parentNode.insertBefore(mark,after);return true}
        return false
      }
      function keyPhrase(text){
        const clauses=(text.match(/[^,.;:!?。]+(?:[,.;:!?。]|$)/g)||[text]).map(v=>v.trim()).filter(v=>v.length>=8);
        const signals=/\d|핵심|중요|필수|반드시|결국|문제|위험|제한|보장|세금|상속|부도|보험|자산|연쇄|현실|전략|변화/;
        let best=clauses[0]||text.trim(),score=-Infinity;
        clauses.forEach((clause,index)=>{let value=(signals.test(clause)?8:0)+(clause.length>=12&&clause.length<=44?4:0)-index*.15;if(/^(예를 들어|또한|하지만|따라서|이러한|이는|특히),?/.test(clause))value-=2;if(value>score){score=value;best=clause}});
        if(best.length>42){let cut=best.slice(0,42),space=cut.lastIndexOf(" ");if(space>=18)cut=cut.slice(0,space);best=cut}
        return best
      }
      // 형광 간격 — 문단마다 넣으면 강조가 무의미해지고, 절마다 하나면 훑을 게 없다.
      // 문단을 걸러 하나씩 넣어 훑는 눈이 형광만 따라가도 줄거리가 이어지게 한다.
      var hlTurn = 0;
      function highlightProse(node){
        const chunks=node.querySelectorAll(".paragraph-chunk");
        const list = chunks.length ? [...chunks] : [node];
        list.forEach(function (chunk) {
          hlTurn += 1;
          if (hlTurn % 2 !== 1) return;              // 한 문단 걸러 하나
          if (chunk.querySelector("mark")) return;
          if (chunk.textContent.trim().length < 60) return;  // 짧은 문단은 건너뛴다
          emphasize(chunk, keyPhrase(chunk.textContent));
        });
      }
      function tuneArticle(article,number){
        article.classList.add("article-"+number);
        const lead=article.querySelector(".lead"),leadPhrase=number===1?"'뇌관'":number===2?"최고세율 50%":"연간 12회";
        emphasize(lead,leadPhrase);
        article.querySelectorAll(".stat").forEach(box=>{
          const value=box.querySelector(".stat__value")?.textContent||"";
          const peak=(number===1&&value.includes("2조 달러"))||(number===2&&value.includes("50%"))||(number===3&&value.includes("12회 제한"));
          if(peak){box.classList.add("peak");box.dataset.peak=article.querySelector(".poster__band").textContent}
          if((number===1&&value.includes("'C'학점"))||(number===2&&/10억 원|2억 5천만 원|2억 원/.test(value))||(number===3&&(/216만 원/.test(value)||/2025년 근골격계/.test(value))))box.classList.add("impact")
        });
        const turn=number===1?"전방위적 파급 효과":number===2?"현명한 자산 승계":"핵심 분석";
        [...article.querySelectorAll(".body-heading")].find(node=>node.textContent.includes(turn))?.parentElement.classList.add("turning-point");
        const detail=number===1?"연쇄 부도":number===2?"6개월 이내":"동일 부위";
        emphasize([...article.querySelectorAll(".body-paragraph")].find(node=>node.textContent.includes(detail)),detail);
        const spotlightPhrases=number===1?["특정 대기업의 부도는 단순히","결국, 기업 부도는 우리 사회 구성원 모두에게"]:number===2?["진정한 부자들은 상속을 단순한 '사후 처리'가 아닌","부동산 상속은 단순히 재산을 물려받는 행위를 넘어"]:["이번 조치는 크게 두 가지 축으로 진행됩니다","결론적으로 이번 제도는 실손보험의 재정 건전성을 확보하고"];
        spotlightPhrases.forEach(phrase=>[...article.querySelectorAll(".body-paragraph,.advice,.note,.statement")].find(node=>node.textContent.includes(phrase))?.classList.add("spotlight"));
        article.querySelectorAll(".lead,.summary-note,.body-paragraph,.advice,.note,.statement").forEach(highlightProse);
      }      function renderArticle(a){const article=el("article","article"),poster=el("header","poster"),core=el("div","poster__core"),foot=el("div","poster__foot");article.id=idOf(a);poster.append(el("div","poster__band",a["카테고리"]));core.append(el("div","poster__number",String(a["번호"])),el("h1","poster__title",a["제목"]),el("p","poster__subtitle",a["부제"]),el("div","poster__square"),el("div","poster__triangle"));poster.append(core);foot.append(el("div","poster__rule"),el("div","poster__block"));poster.append(foot);article.append(poster);
        const intro=el("section","article-intro"),inner=el("div","article-intro__inner");a["요약"].forEach((text,index)=>{if(index===0)inner.append(prose("p","lead",text));else if(isStat(text))inner.append(stat(text));else inner.append(prose("p","summary-note",text))});a["한마디"].forEach(text=>inner.append(el("blockquote","quote-block",text)));intro.append(inner);article.append(intro,renderBody(a["본문"]));tuneArticle(article,a["번호"]);return article
      }
      const root=document.getElementById("articles");articles.forEach(a=>root.append(renderArticle(a)));
      const progress=document.querySelector(".progress"),update=()=>{const total=document.documentElement.scrollHeight-innerHeight;progress.style.width=(total>0?Math.min(100,Math.max(0,scrollY/total*100)):0)+"%"};addEventListener("scroll",update,{passive:true});addEventListener("resize",update);update();
    })();
  </script>
</body>
</html>
